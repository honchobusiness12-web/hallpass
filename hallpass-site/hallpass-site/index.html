<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Hall Pass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Draft an all-time basketball roster from any decade, pick a coach, and simulate a full season and playoffs.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: arena at night. A scoreboard-lit top bar, era "tickets" as the entry point, hardwood + amber bulbs as the one bold motif. */
:root{
  --ink:#0b1020; --ink-2:#111830; --panel:#161e36; --panel-2:#1c2542; --line:#2a3557;
  --text:#eef1f8; --mute:#8f9abb; --amber:#ffb547; --amber-deep:#e08a12; --maple:#d9a066;
  --win:#4fd18b; --loss:#ff6b6b; --violet:#9b8cff;
  --f-display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --f-body:"Barlow", "Segoe UI", system-ui, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:14px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.5;overflow-x:hidden;
  background-image:radial-gradient(1200px 500px at 50% -200px, rgba(255,181,71,.10), transparent 70%),radial-gradient(800px 400px at 100% 100%, rgba(155,140,255,.07), transparent 70%);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,.era:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1}
.mono{font-family:var(--f-mono)}
.label{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:rgba(11,16,32,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.logo b{font-family:var(--f-display);font-weight:900;font-size:26px;letter-spacing:.04em;line-height:1}
.logo b span{color:var(--amber)}
.nav{margin-left:auto;display:flex;gap:4px;align-items:center}
.nav .nb{background:none;border:0;padding:8px 12px;border-radius:10px;color:var(--mute);font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.nav .nb:hover{color:var(--text);background:var(--panel)}
.nav .nb svg{width:18px;height:18px}
.acct-btn{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 14px 4px 4px;font-weight:600;font-size:14px;transition:border-color .2s, transform .2s}
.acct-btn:hover{border-color:var(--amber);transform:translateY(-1px)}
@media (max-width:720px){.nav .nb span{display:none}.acct-btn .an{display:none}.acct-btn{padding:4px}}

/* avatar */
.av{--g1:#ffb547;--g2:#ff5e7e;position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:15px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#140d00;flex:none}
.av.big{width:92px;height:92px;font-size:38px}
.av.big::before{content:"";position:absolute;inset:-6px;border-radius:50%;background:conic-gradient(from 0deg,var(--g1),transparent 40%,var(--g2) 60%,transparent 85%,var(--g1));animation:spin 4s linear infinite;z-index:-1;-webkit-mask:radial-gradient(circle,transparent 49px,#000 50px);mask:radial-gradient(circle,transparent 49px,#000 50px)}
@keyframes spin{to{transform:rotate(360deg)}}

/* views */
.view{padding-block:28px 64px;animation:viewIn .5s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:.0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* hero */
.hero{display:grid;grid-template-columns:1.3fr .9fr;gap:24px;align-items:end;margin-bottom:28px}
.hero h1{font-size:clamp(44px,7.4vw,92px);font-weight:900;text-transform:uppercase;line-height:.88}
.hero h1 em{font-style:normal;color:var(--amber);text-shadow:0 0 24px rgba(255,181,71,.45)}
.hero p{color:var(--mute);max-width:52ch;margin:14px 0 0;font-size:17px}
.marquee{overflow:hidden;border-block:1px solid var(--line);margin-bottom:26px;mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);-webkit-mask:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marquee div{display:flex;gap:40px;padding-block:9px;width:max-content;animation:scroll 38s linear infinite;font-family:var(--f-mono);font-size:12px;color:var(--mute);letter-spacing:.08em;text-transform:uppercase}
.marquee b{color:var(--amber);font-weight:600}
@keyframes scroll{to{transform:translateX(-50%)}}
@media (max-width:860px){.hero{grid-template-columns:1fr}}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.quick div{background:var(--ink-2);padding:12px 14px}
.quick b{display:block;font-family:var(--f-display);font-size:30px;font-weight:800;color:var(--amber);font-variant-numeric:tabular-nums;line-height:1.1}

/* era grid */
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 14px;flex-wrap:wrap}
.section-h h2{font-size:30px;font-weight:800;text-transform:uppercase}
.eras{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.era{position:relative;text-align:left;border:1px solid var(--line);border-radius:var(--r);padding:16px;min-height:148px;overflow:hidden;background:linear-gradient(150deg,var(--c2) 0%,var(--ink-2) 85%);transition:transform .25s cubic-bezier(.2,.8,.2,1),border-color .25s,box-shadow .25s;isolation:isolate}
.era::after{content:attr(data-num);position:absolute;right:-6px;bottom:-26px;font-family:var(--f-display);font-weight:900;font-size:120px;line-height:1;color:transparent;-webkit-text-stroke:1.5px var(--c1);opacity:.35;z-index:-1;transition:opacity .3s,transform .4s}
.era:hover{transform:translateY(-4px);border-color:var(--c1);box-shadow:0 14px 40px -18px var(--c1)}
.era:hover::after{opacity:.7;transform:translateX(-6px)}
.era.sel{border-color:var(--c1);box-shadow:0 0 0 2px var(--c1),0 18px 50px -18px var(--c1)}
.era.sel::after{opacity:.9}
.era h3{font-size:34px;font-weight:900;color:var(--c1)}
.era small{display:block;color:var(--text);opacity:.8;font-size:13px;margin-top:6px;max-width:20ch}
.era .yrs{font-family:var(--f-mono);font-size:11px;color:var(--mute);letter-spacing:.1em}
.era .check{position:absolute;top:12px;right:12px;width:22px;height:22px;border-radius:50%;background:var(--c1);color:#000;display:grid;place-items:center;transform:scale(0);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.era.sel .check{transform:scale(1)}

.setup{display:grid;grid-template-columns:1fr 1fr auto;gap:16px;align-items:end;margin-top:22px;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--ink-2)}
@media (max-width:860px){.setup{grid-template-columns:1fr}}
.seg{display:flex;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px;position:relative;margin-top:8px}
.seg button{flex:1;background:none;border:0;padding:9px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--mute);position:relative;z-index:1;transition:color .2s}
.seg button.on{color:#1a1000}
.seg .pill{position:absolute;top:4px;bottom:4px;border-radius:9px;background:var(--amber);transition:left .35s cubic-bezier(.2,.8,.2,1),width .35s cubic-bezier(.2,.8,.2,1);z-index:0}
.hint{font-size:13px;color:var(--mute);margin-top:6px;min-height:1.4em}

.btn{border:0;border-radius:12px;padding:14px 22px;font-weight:700;font-size:15px;letter-spacing:.02em;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s, box-shadow .2s, background .2s, opacity .2s}
.btn-go{background:var(--amber);color:#1a1000;box-shadow:0 8px 26px -8px rgba(255,181,71,.7)}
.btn-go:hover{transform:translateY(-2px);box-shadow:0 14px 34px -8px rgba(255,181,71,.8)}
.btn-go:active{transform:translateY(0) scale(.98)}
.btn-go:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn-ghost{background:var(--panel);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--mute)}
.btn-big{padding:16px 30px;font-size:17px;font-family:var(--f-display);font-weight:800;text-transform:uppercase;letter-spacing:.06em}

.side-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
@media (max-width:860px){.side-grid{grid-template-columns:1fr}}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--ink-2);padding:18px}
.weekly{background:linear-gradient(120deg,rgba(255,181,71,.14),transparent 60%),var(--ink-2);border-color:rgba(255,181,71,.35)}
.weekly h3{font-size:26px;font-weight:800;text-transform:uppercase;margin:6px 0}
.weekly .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--mute)}
.tag.done{color:var(--win);border-color:rgba(79,209,139,.4)}

/* draft */
.draft-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.draft-top h2{font-size:36px;font-weight:900;text-transform:uppercase}
.draft-top .meta{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.draft{display:grid;grid-template-columns:380px 1fr;gap:20px;align-items:start}
@media (max-width:960px){.draft{grid-template-columns:1fr}}
.court-wrap{border:1px solid var(--line);border-radius:var(--r);background:var(--ink-2);padding:14px;position:sticky;top:76px}
@media (max-width:960px){.court-wrap{position:static}}
.court{position:relative;aspect-ratio:1/0.82;max-width:100%;border-radius:10px;overflow:hidden;background:repeating-linear-gradient(90deg,var(--cs1,#c48a52) 0 26px,var(--cs2,#b97f49) 26px 52px),var(--cs1,#c48a52)}
.court svg{position:absolute;inset:0;width:100%;height:100%}
.slot{position:absolute;transform:translate(-50%,-50%);width:86px;text-align:center}
.slot .disc{width:56px;height:56px;margin:0 auto;border-radius:50%;border:2px dashed rgba(20,10,0,.55);background:rgba(20,10,0,.18);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:18px;color:rgba(20,10,0,.65);transition:all .3s}
.slot.active .disc{border-color:#fff;color:#fff;background:rgba(11,16,32,.55);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,255,255,.18)}}
.slot.filled .disc{border:2px solid var(--c1,#fff);background:linear-gradient(140deg,var(--c2,#222),#0b1020);color:var(--c1,#fff);font-size:22px;animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}
.slot .nm{margin-top:4px;font-size:12px;font-weight:700;color:#1a0f00;background:rgba(255,236,210,.85);border-radius:6px;padding:1px 6px;display:inline-block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bench{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.bslot{border:1px dashed var(--line);border-radius:10px;padding:8px;text-align:center;min-height:62px;transition:all .3s}
.bslot.active{border-color:var(--amber);border-style:solid;box-shadow:inset 0 0 0 1px var(--amber)}
.bslot.filled{border-style:solid;border-color:var(--c1);background:linear-gradient(140deg,var(--c2),var(--ink-2));animation:pop .45s cubic-bezier(.3,1.6,.5,1)}
.bslot b{display:block;font-family:var(--f-display);font-size:20px;color:var(--c1,var(--mute));line-height:1.1}
.bslot span{font-size:12px;color:var(--text);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rating-strip{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.rating-strip b{font-family:var(--f-display);font-size:34px;font-weight:900;color:var(--amber);font-variant-numeric:tabular-nums}
.budget{margin-top:12px}
.budget .bar{height:8px;border-radius:99px;background:var(--ink);overflow:hidden;margin-top:6px}
.budget .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--win),var(--amber));transition:width .6s cubic-bezier(.2,.8,.2,1)}

.pick-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pick-h h3{font-size:28px;font-weight:800;text-transform:uppercase}
.pick-h .grow{flex:1}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;perspective:1100px}

/* player card */
.pcard{--c1:#ffb547;--c2:#3a2a10;position:relative;border-radius:16px;padding:14px;min-height:250px;background:linear-gradient(160deg,var(--c2) 0%,#0c1122 75%);border:1px solid rgba(255,255,255,.08);text-align:left;display:flex;flex-direction:column;gap:8px;transform-style:preserve-3d;transition:transform .2s ease-out,box-shadow .3s,border-color .3s;overflow:hidden;animation:deal .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes deal{from{opacity:0;transform:translateY(40px) rotate(-6deg) scale(.9)}to{opacity:1;transform:none}}
.pcard:hover{border-color:var(--c1);box-shadow:0 20px 50px -20px var(--c1)}
.pcard .shine{position:absolute;inset:0;pointer-events:none;background:radial-gradient(400px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.16),transparent 45%);opacity:0;transition:opacity .3s}
.pcard:hover .shine{opacity:1}
.pcard.icon::before{content:"";position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.12),transparent 30%,rgba(155,140,255,.18),transparent 60%,rgba(255,181,71,.18),transparent 80%);animation:spin 7s linear infinite;pointer-events:none}
.pcard>*{position:relative}
.pc-top{display:flex;justify-content:space-between;align-items:center}
.pc-pos{font-weight:700;font-size:12px;letter-spacing:.1em;background:rgba(0,0,0,.35);padding:3px 8px;border-radius:6px}
.pc-tier{font-size:10px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--c1)}
.pc-ovr{font-family:var(--f-display);font-weight:900;font-size:64px;line-height:.9;color:var(--c1);text-shadow:0 0 30px color-mix(in srgb,var(--c1) 40%,transparent)}
.pc-name{font-size:15px;line-height:1.15;color:var(--text);opacity:.9}
.pc-name b{display:block;font-family:var(--f-display);font-size:26px;font-weight:800;text-transform:uppercase;opacity:1;letter-spacing:.01em}
.pc-bars{display:grid;gap:5px;margin-top:auto}
.pc-bar{display:grid;grid-template-columns:30px 1fr 24px;gap:6px;align-items:center;font-size:11px;color:var(--mute);font-family:var(--f-mono)}
.pc-bar i{height:5px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}
.pc-bar i s{display:block;height:100%;background:var(--c1);width:0;transition:width .8s .2s cubic-bezier(.2,.8,.2,1)}
.pc-bar em{font-style:normal;color:var(--text);text-align:right}
.pc-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mute)}
.pc-cost{font-family:var(--f-mono);font-weight:600;color:var(--win)}
.pcard.cant{filter:grayscale(.9) brightness(.6);cursor:not-allowed}
.pcard.cant .pc-cost{color:var(--loss)}
.fly{position:fixed;z-index:200;pointer-events:none;transition:transform .6s cubic-bezier(.6,0,.3,1),opacity .6s ease-in;margin:0}

.search{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--text);font:inherit}
.sandbox-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;max-height:none}

/* coach */
.coaches{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.coach{text-align:left;border:1px solid var(--line);border-radius:var(--r);padding:18px;background:var(--ink-2);display:flex;flex-direction:column;gap:10px;transition:transform .25s,border-color .25s,box-shadow .25s;animation:deal .5s both}
.coach:hover{transform:translateY(-4px);border-color:var(--amber);box-shadow:0 18px 40px -20px var(--amber)}
.coach .glyph{width:48px;height:48px;border-radius:12px;background:var(--panel-2);display:grid;place-items:center;color:var(--amber)}
.coach h3{font-size:26px;font-weight:800;text-transform:uppercase}
.coach p{margin:0;color:var(--mute);font-size:14px}
.coach .fx{display:flex;gap:6px;flex-wrap:wrap}
.fxp{font-family:var(--f-mono);font-size:11px;padding:3px 8px;border-radius:6px;background:rgba(79,209,139,.12);color:var(--win)}
.fxn{background:rgba(255,107,107,.12);color:var(--loss)}

/* scoreboard */
.board{border-radius:18px;padding:18px 20px;background:linear-gradient(180deg,#0a0e1b,#121a31);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 30px 60px -30px rgba(0,0,0,.8);display:grid;grid-template-columns:auto 1fr auto;gap:20px;align-items:center}
@media (max-width:720px){.board{grid-template-columns:1fr 1fr}.board .mid{grid-column:1/-1;order:3}}
.bulbs{font-family:var(--f-display);font-weight:900;font-size:clamp(54px,9vw,96px);line-height:.85;color:var(--amber);text-shadow:0 0 18px rgba(255,181,71,.55),0 0 2px #fff3;font-variant-numeric:tabular-nums;letter-spacing:.02em;
  background-image:radial-gradient(circle,rgba(255,255,255,.0) 1px,transparent 1.5px);}
.bulbs.l{color:var(--loss);text-shadow:0 0 18px rgba(255,107,107,.45)}
.board .cap{font-size:11px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase;font-weight:600}
.board .mid{text-align:center}
.board .gm{font-family:var(--f-mono);font-size:13px;color:var(--mute)}
.board .tn{font-family:var(--f-display);font-size:28px;font-weight:800;text-transform:uppercase;margin:4px 0}
.progress{height:6px;background:var(--ink);border-radius:9px;overflow:hidden;margin-top:10px}
.progress i{display:block;height:100%;width:0;background:var(--amber);transition:width .25s}

.season-grid{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:16px}
@media (max-width:960px){.season-grid{grid-template-columns:1fr}}
.chart{width:100%;height:170px;display:block}
.ticker{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto;font-family:var(--f-mono);font-size:13px}
.ticker li{display:grid;grid-template-columns:44px 22px 84px 1fr;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line);animation:tick .35s ease-out}
@keyframes tick{from{opacity:0;transform:translateX(-12px);background:rgba(255,181,71,.12)}}
.ticker .W{color:var(--win);font-weight:600}.ticker .L{color:var(--loss);font-weight:600}
.ticker .op{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);text-align:left;font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid rgba(42,53,87,.6);white-space:nowrap}
tr.me td{color:var(--amber);font-weight:700;background:rgba(255,181,71,.07)}
td.n,th.n{text-align:right}
.speed{display:flex;gap:6px;flex-wrap:wrap}
.speed button{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-weight:600;font-size:13px}
.speed button.on{border-color:var(--amber);color:var(--amber)}

/* bracket */
.bracket-wrap{overflow-x:auto;padding-bottom:8px}
.bracket{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:18px;min-width:860px}
.round h4{font-family:var(--f-display);text-transform:uppercase;font-size:18px;font-weight:800;color:var(--mute);margin:0 0 10px}
.round .col{display:flex;flex-direction:column;justify-content:space-around;gap:10px;height:100%}

.wa{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;margin-top:10px}@media (max-width:700px){.wa{grid-template-columns:1fr}}

.waside{display:grid;gap:10px;align-content:start}.wapts{text-align:center}.wapts b{display:block;font-family:var(--f-display);font-size:54px;font-weight:900;color:var(--amber);line-height:1}.wapts b.sad{color:#ff8a8a}.wapts small{color:var(--mute)}

/* ============ CHEMISTRY ============ */
function chemistry(starters,slots,coach){let s=0;const links=[];const st=starters.filter(Boolean);if(!st.length)return{s:0,links,bonus:0};
  const ec={};st.forEach(p=>ec[p.era]=(ec[p.era]||0)+1);
  Object.entries(ec).forEach(([e,n])=>{if(n>=2){s+=(n-1)*.6;links.push(`${n} starters from the ${(ERAS[e]||{full:'rookie class'}).full}`)}});
  const w=t=>st.filter(p=>hasT(p,t));const fg=w('fg'),sh=w('shooter'),bigs=st.filter(p=>p.pos==='PF'||p.pos==='C');
  const big=bigs.find(b=>!fg.includes(b));
  if(fg.length&&big){s+=1;links.push(`Pick-and-roll: ${last(fg[0].name)} + ${last(big.name)}`)}
  const sh1=sh.find(x=>!fg.includes(x));if(fg.length&&sh1){s+=1;links.push(`Kick-out threes: ${last(fg[0].name)} + ${last(sh1.name)}`)}
  const lk=w('lock'),gl=w('glass');const g1=gl.find(x=>!lk.slice(0,1).includes(x));if(lk.length&&g1){s+=.8;links.push(`Defensive anchor: ${last(lk[0].name)} + ${last(g1.name)}`)}
  const ld=w('leader');if(ld.length){s+=1;links.push(`${last(ld[0].name)} runs the locker room`)}
  if(w('show').length>=2){s+=.6;links.push('Showtime backcourt')}
  if(slots&&st.length===5&&st.every((p,k)=>p.pos===slots[k])){s+=1;links.push('Everyone at their natural position')}
  if(fg.length>=3){s-=.8;links.push('Too many ball-handlers (−)')}
  s=Math.max(0,Math.min(10,s))*((coach&&coach.chem)||1);s=Math.min(12,s);
  return{s:+s.toFixed(1),links,bonus:+(s*.22).toFixed(2)}}
function chemHTML(ch){const pct=Math.min(100,ch.s/10*100);return `<div class="chem"><div class="lvl-row"><span class="label">Chemistry</span><b class="mono">${ch.s.toFixed(1)}</b></div><div class="chembar"><i style="width:${pct}%"></i></div>${ch.links.length?`<ul class="chemlist">${ch.links.map(l=>`<li class="${/\(−\)/.test(l)?'neg':''}">${esc(l)}</li>`).join('')}</ul>`:'<p class="hint">Starters from the same decade, a floor general with a big man or a shooter, and natural positions all build chemistry.</p>'}</div>`}

      const add=list=>list.forEach(p=>{if(!names.has(p.name)&&cost(p)<=max){names.add(p.name);cheap.push(p)}});

let SIM=null;

    if(g.aWin){A.w++;B.l++}else{B.w++;A.l++}

  $('#skipPo').onclick=()=>ctx.skip=true;window.scrollTo({top:0});

  for(let r=0;r<4;r++){

    const col=$('#r'+r);col.innerHTML=series.map((s,i)=>`<div class="series ${s.a.me||s.b.me?'mine':''}" id="s${r}-${i}" style="animation-delay:${i*50}ms">${tmRow(s.a,'a')}${tmRow(s.b,'b')}<div class="dots"></div></div>`).join('');
    const maxG=Math.max(...series.map(s=>s.games.length));
    for(let g=0;g<maxG;g++){if(!ctx.skip&&!RM)await sleep(r===3?240:110);if(my!==RUN)return;
      series.forEach((s,i)=>{if(g>=s.games.length)return;const el=$(`#s${r}-${i}`);const aw=s.games[g];el.querySelector('.dots').insertAdjacentHTML('beforeend',`<i class="${aw?'a':'b'}"></i>`);s.sa+=aw?1:0;s.sb+=aw?0:1;el.querySelector('[data-k=a] .sc').textContent=s.sa;el.querySelector('[data-k=b] .sc').textContent=s.sb})}
    series.forEach((s,i)=>{const el=$(`#s${r}-${i}`);el.querySelector(`[data-k=${s.winner===s.a?'b':'a'}]`).classList.add('out')});
    const mine=series.find(s=>s.a.me||s.b.me);
    if(mine){if(mine.winner.me){ctx.finish=r===3?'Champions':ctx.finish;if(r===3)ctx.finalsSweep=mine.games.length===4}else{ctx.finish=['Lost in first round','Lost in semifinals','Lost in conference finals','Lost in Finals'][r]}}
    ctx.rounds.push(series);

}

function confetti(){if(RM)return;const c=$('#fx'),x=c.getContext('2d');const dpr=devicePixelRatio||1;c.width=innerWidth*dpr;c.height=innerHeight*dpr;x.setTransform(dpr,0,0,dpr,0,0);

  let f=0;const step=()=>{x.clearRect(0,0,innerWidth,innerHeight);ps.forEach(p=>{p.vy+=.32;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);x.restore()});if(++f<240)requestAnimationFrame(step);else x.clearRect(0,0,innerWidth,innerHeight)};step()}

  const step=()=>{x.clearRect(0,0,innerWidth,innerHeight);let alive=false;ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vx*=.95;p.vy*=.95;p.l-=.02;if(p.l>0){alive=true;x.globalAlpha=p.l;x.fillStyle=p.c;x.beginPath();x.arc(p.x,p.y,3,0,7);x.fill()}});x.globalAlpha=1;if(alive)requestAnimationFrame(step);else x.clearRect(0,0,innerWidth,innerHeight)};step()}

/* ============ HEAD-TO-HEAD: shared rules ============ */
const H2H_SLOTS=['PG','SG','SF','PF','C','B1','B2'];
const SLOT_LBL={PG:'PG',SG:'SG',SF:'SF',PF:'PF',C:'C',B1:'6th',B2:'7th'};
const ERA_ORDER=['50s','60s','70s','80s','90s','2000s','2010s','2020s'];

const poolCache={};
function buildPool(era,n){const key=era+n;if(poolCache[key])return poolCache[key];
  const need=n*H2H_SLOTS.length+8;let eras=era==='mix'?[...ERA_ORDER]:[era];
  const make=()=>{const m=new Map();for(const e of eras)for(const p of PLAYERS){if(p.era!==e)continue;const o=m.get(p.name);
      if(!o||(o.era!==era&&(p.era===era||p.ovr>o.ovr)))m.set(p.name,p)}return[...m.values()]};
  let pool=make();const i=ERA_ORDER.indexOf(era);let d=1;
  while(era!=='mix'&&pool.length<need&&d<8){if(ERA_ORDER[i-d])eras.push(ERA_ORDER[i-d]);if(ERA_ORDER[i+d])eras.push(ERA_ORDER[i+d]);d++;pool=make()}
  return poolCache[key]=pool.sort((a,b)=>b.ovr-a.ovr)}

const drafter=st=>st.picks.length<totalPicks(st)?ownerAt(st,st.picks.length):-1;
function assignSlot(ros,p){const open=s=>!ros[s];
  if(open(p.pos))return p.pos;const adj=(ADJ[p.pos]||[]).find(open);if(adj)return adj;
  const b=['B1','B2'].find(open);if(b)return b;return H2H_SLOTS.find(open)}
function rosterOf(st,pi){const ros={};st.picks.forEach((idx,i)=>{if(ownerAt(st,i)===pi){const p=PLAYERS[idx];const s=assignSlot(ros,p);if(s)ros[s]=p}});return ros}
const takenNames=st=>new Set(st.picks.map(i=>PLAYERS[i].name));

/* ============ HEAD-TO-HEAD: networking ============
   Two transports with the same shape. On a normal website: peer-to-peer WebRTC via the free PeerJS
   matchmaking server. On the claude.ai page: the page's live room (presence). The host's browser is the
   referee: guests send actions, the host checks them and sends everyone the full game state. */
const PEER_PREFIX='hallpass-v2-';
const PEER_OPTS={config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},{urls:'stun:stun.cloudflare.com:3478'}]}};
/* Relay: public MQTT brokers over secure WebSockets. Every message goes through the broker, so it works on networks
   where a direct browser-to-browser link can't be made. The first letter of the room code picks the broker, so the
   host and guests always meet on the same one. */
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081'];
const brokerFor=code=>CODE_CHARS.indexOf(code[0])%BROKERS.length;
function genCodeFor(b){let c;do{c=genCode()}while(brokerFor(c)!==b);return c}
const LSC={};function loadScript(src,ok){if(ok())return Promise.resolve();if(LSC[src])return LSC[src];return LSC[src]=new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=()=>ok()?res():rej(new Error('lib'));s.onerror=()=>{delete LSC[src];rej(new Error('lib'))};document.head.appendChild(s)})}
const loadMqtt=()=>loadScript('https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js',()=>!!window.mqtt);
/* Relay rooms live on all three public relay servers at once, so one slow or broken server never blocks a game.
   The host re-sends the room whenever its connection comes back, so a phone that briefly pauses keeps its room. */
function mqttConnect(url,will){return loadMqtt().then(()=>new Promise((res,rej)=>{let done=false;
  const c=mqtt.connect(url,{clientId:'hp_'+rid(),clean:true,connectTimeout:5000,reconnectPeriod:2000,keepalive:20,will});
  c.on('connect',()=>{if(!done){done=true;res(c)}});c.on('error',()=>{});
  setTimeout(()=>{if(!done){done=true;try{c.end(true)}catch(e){}rej(new Error('relay-down'))}},6000)}))}
async function relayHost(code,h,b,resume){const base='hallpass/v3/'+code;
  const c=await mqttConnect(BROKERS[b]);let ready=false,taken=false,last=null;const seen=new Map();
  c.on('message',(t,p)=>{if(t===base+'/state'){if(!ready&&p.length)taken=true;return}
    if(t!==base+'/g'||!ready)return;let d;try{d=JSON.parse(p.toString())}catch(e){return}if(!d||!d.uid)return;
    if(d.bye){if(seen.delete(d.uid))h.left(d.uid);return}seen.set(d.uid,Date.now());h.guest(d)});

  c.on('connect',pub);

  const sweep=setInterval(()=>{const now=Date.now();seen.forEach((t,u)=>{if(now-t>20000){seen.delete(u);h.left(u)}})},4000);
  return{kind:'relay',broadcast(st){last=JSON.stringify(st);pub()},setMe(){},
    close(){clearInterval(sweep);clearInterval(keep);try{c.publish(base+'/state','',{retain:true,qos:0},()=>{try{c.end()}catch(e){}})}catch(e){}setTimeout(()=>{try{c.end(true)}catch(e){}},1200)}}}
function relayJoin(code,h){const base='hallpass/v3/'+code;return loadMqtt().then(()=>new Promise((res,rej)=>{
  const conns=[];let got=false,gone=false,me=null,hb=null,fails=0,rev=-1,lid=null;
  const send=(c,m)=>{try{c.publish(base+'/g',JSON.stringify(m))}catch(e){}};
  const api={kind:'relay',broadcast(){},setMe(m){me=m;conns.forEach(c=>send(c,m))},close(){gone=true;clearInterval(hb);conns.forEach(c=>{send(c,{uid:ON.uid,bye:1});setTimeout(()=>{try{c.end(true)}catch(e){}},600)})}};
  BROKERS.forEach(url=>{mqttConnect(url,{topic:base+'/g',payload:JSON.stringify({uid:ON.uid,bye:1}),retain:false,qos:0}).then(c=>{
      if(gone&&!got){try{c.end(true)}catch(e){}return}conns.push(c);
      c.on('message',(t,p)=>{if(t!==base+'/state')return;
        if(!p.length){if(got&&!api.dead){api.dead=true;clearInterval(hb);h.hostLeft()}return}
        let st;try{st=JSON.parse(p.toString())}catch(e){return}
        const id=st.id||st.code;if(id===lid&&(st.rev||0)<rev)return;lid=id;rev=st.rev||0;
        if(!got){got=true;hb=setInterval(()=>{if(me)conns.forEach(x=>send(x,me))},4000);res(api)}h.state(st)});
      c.subscribe(base+'/state');if(me)send(c,me)}).catch(()=>{if(++fails===BROKERS.length&&!got){gone=true;rej(new Error('relay-down'))}})});
  setTimeout(()=>{if(!got){gone=true;conns.forEach(c=>{try{c.end(true)}catch(e){}});rej(new Error('notfound'))}},10000)}))}
function multiNet(list){let last=null,closed=false;return{get kind(){return list.map(t=>t.kind).join('+')},broadcast(st){last=st;list.forEach(t=>t.broadcast(st))},setMe(m){list.forEach(t=>t.setMe(m))},
  close(){closed=true;list.forEach(t=>t.close())},add(t){if(closed){t.close();return}list.push(t);if(last)t.broadcast(last);if(ON.st)onlineRender()}}}
/* ======================= CLOUD ROOMS: online games over the database's realtime connection =======================
   This uses the same secure web connection as the rest of the site (port 443), so it works on school, work and home
   Wi-Fi that block the old public relays. The old relays and the direct link still run alongside as backups. */
async function sbClient(){if(typeof DB==='undefined')throw new Error('lib');if(DB.c)return DB.c;await Promise.race([loadSB(),new Promise((_,j)=>setTimeout(()=>j(new Error('lib')),8000))]);
  if(!DB.c)DB.c=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,storageKey:'hp_sb_auth'}});return DB.c}
const sbChan=(c,code,key)=>c.channel('hp-room-'+code,{config:{broadcast:{self:false,ack:false},presence:{key}}});
function sbSubscribe(ch,ms){return new Promise((res,rej)=>{let done=false;
  ch.subscribe(s=>{if(done)return;if(s==='SUBSCRIBED'){done=true;res()}else if(s==='CHANNEL_ERROR'||s==='TIMED_OUT'||s==='CLOSED'){done=true;rej(new Error('connect'))}});

const sbSend=(ch,event,payload)=>{try{const r=ch.send({type:'broadcast',event,payload});if(r&&r.catch)r.catch(()=>{})}catch(e){}};
async function sbHost(code,h,resume){const c=await sbClient();const ch=sbChan(c,code,'host-'+ON.uid);
  const seen=new Map();let last=null,timer=null,lastSent=0,closed=false;
  const sendNow=()=>{clearTimeout(timer);timer=null;if(!last||closed)return;lastSent=Date.now();sbSend(ch,'st',last)};

  if(!resume){await sleep(600);const ps=ch.presenceState()||{};if(Object.keys(ps).some(k=>k.startsWith('host-')&&k!=='host-'+ON.uid)){try{c.removeChannel(ch)}catch(e){}throw new Error('taken')}}
  try{const t=ch.track({k:'host',at:Date.now()});if(t&&t.catch)t.catch(()=>{})}catch(e){}

function computeShowdown(st){

    const teams=st.players.map((p,i)=>{const ros=rosterOf(st,i);const coach=COACHES.find(c=>c.id===p.c)||COACHES[0];const t=teamCalc(ros,coach);return{i,name:p.name,g:p.g,ros,coach,rating:t.rating,sw:0,sl:0,gw:0,gl:0,pts:{}}});
    const score=(T,total)=>{const list=H2H_SLOTS.map((s,k)=>T.ros[s]?{p:T.ros[s],w:Math.pow(pstat(T.ros[s])[0],1.75)*((k<5?34:16)/36)*(.75+R()*.5)}:null).filter(Boolean);const sum=list.reduce((a,b)=>a+b.w,0);let top=null;
      list.forEach(x=>{const pts=Math.round(total*x.w/sum);T.pts[x.p.name]=(T.pts[x.p.name]||0)+pts;if(!top||pts>top.pts)top={n:last(x.p.name),pts}});return top};
    const series=(A,B,isFinal)=>{let wa=0,wb=0;const games=[];while(wa<4&&wb<4){const g=playGame(A.rating+A.coach.po,B.rating+B.coach.po,pace-2);games.push({a:g.a,b:g.b,aw:g.aWin,ta:score(A,g.a),tb:score(B,g.b)});g.aWin?wa++:wb++;
        if(!isFinal){A.gw+=g.aWin?1:0;A.gl+=g.aWin?0:1;B.gw+=g.aWin?0:1;B.gl+=g.aWin?1:0}}
      if(!isFinal){if(wa===4){A.sw++;B.sl++}else{B.sw++;A.sl++}}return{a:A.i,b:B.i,games,wa,wb,winner:wa===4?A.i:B.i}};
    const rr=[];for(let a=0;a<teams.length;a++)for(let b=a+1;b<teams.length;b++)rr.push(series(teams[a],teams[b],false));
    const standing=[...teams].sort((x,y)=>y.sw-x.sw||(y.gw-y.gl)-(x.gw-x.gl)||y.rating-x.rating);
    const final=teams.length>=3?series(standing[0],standing[1],true):null;

}

let LGEN={k:'',v:[]},LPC={k:'',m:new Map()},LPOOL={k:'',v:[]};

  for(let s=0;s<=L.season;s++){const n=s===0?L.rk0:8;for(let j=0;j<n;j++){let name,tries=0;
      do{name=LG_FIRST[r()*LG_FIRST.length|0]+' '+LG_LAST[r()*LG_LAST.length|0]}while(used.has(name)&&++tries<60);used.add(name);
      const pos=LG_POS[r()*5|0];const ovr=Math.round((s===0?73:70)+r()*8+r()*7);const tilt=Math.round((r()-.5)*12);
      out.push({id:`rk:${L.seed}:${s}:${j}`,name,pos,ovr,off:clamp(ovr+tilt,60,99),def:clamp(ovr-tilt,60,99),era:'rk',rk:s})}}

  const base=i<PLAYERS.length?PLAYERS[i]:lgGen(L)[i-PLAYERS.length];
  if(!base)return{id:'x',name:'Unknown',pos:'SF',ovr:60,off:60,def:60,era:'rk'};
  const d=(L.dev&&L.dev[i])||0,dO=(L.devO&&L.devO[i])||0,dD=(L.devD&&L.devD[i])||0;
  p=(d||dO||dD)?{...base,ovr:clamp(base.ovr+d+Math.round((dO+dD)/2),50,99),off:clamp(base.off+d+dO,45,99),def:clamp(base.def+d+dD,45,99)}:base;

      const q=PLAYERS[o];const pref=x=>(x.era===era?100:0)+x.ovr;if(pref(p)>pref(q))m.set(p.name,i)});return[...m.values()]};

/* ---------- draft ---------- */
const lgOnClock=L=>{const d=L.draft;return d&&d.n<d.order.length?d.order[d.n]:-1};

/* ---------- rosters & lineups ---------- */
function lgAutoLineup(L,t,avoid){avoid=avoid||[];const inj=i=>lgC(L,i)[2]>0;const healthy=t.roster.filter(i=>!inj(i)&&!avoid.includes(i));
  const others=t.roster.filter(i=>!healthy.includes(i));const used=new Set();const out=[null,null,null,null,null];
  const fill=pool=>['C','PG','PF','SG','SF'].forEach(slot=>{const k=LG_POS.indexOf(slot);if(out[k]!==null)return;let b=null,bs=-1e9;
    pool.forEach(i=>{if(used.has(i))return;const p=LP(L,i);const s=p.ovr-SLOT_PEN(p,slot)*1.6;if(s>bs){bs=s;b=i}});if(b!==null){used.add(b);out[k]=b}});
  fill(healthy);fill(others);return out.filter(v=>v!==null).length===5?out:out.map(v=>v===null?t.roster.find(i=>!out.includes(i)):v)}
function lgFix(L,t){const lu=t.lineup||[];const seen=new Set();

  t.rest=(t.rest||[]).filter(i=>t.roster.includes(i));if(ok)return;
  const auto=lgAutoLineup(L,t,[]);const keep=new Set();
  const out=LG_POS.map((_,k)=>{const i=lu[k];if(i!=null&&t.roster.includes(i)&&!keep.has(i)){keep.add(i);return i}return null});
  out.forEach((v,k)=>{if(v!==null)return;const c=auto[k]!=null&&!keep.has(auto[k])?auto[k]:auto.find(i=>!keep.has(i));const cc=c!=null?c:t.roster.find(i=>!keep.has(i));if(cc!=null){keep.add(cc);out[k]=cc}});
  t.lineup=out.every(v=>v!=null)?out:auto}
function lgValidLineup(t,v){return Array.isArray(v)&&v.length===5&&new Set(v).size===5&&v.every(i=>t.roster.includes(+i))}
function lgCleanPlan(v){const c=q=>({pace:PACE[q&&q.pace]?q.pace:'normal',focus:FOCUS[q&&q.focus]?q.focus:'balanced',def:DEFS[q&&q.def]?q.def:'man'});

/* ---------- schedule ---------- */
let LSCH={k:'',v:[]};
function lgSched(L){const k=L.seed+':'+L.season+':'+L.size+':'+L.gpp;if(LSCH.k===k)return LSCH.v;

const lgCurSeries=(L,ti)=>L.po?L.po.series.find(s=>s.round===L.po.round&&(s.a===ti||s.b===ti)):null;
function lgOut(L,ti){if(L.phase==='season')return false;if(L.phase!=='playoffs')return true;const s=lgCurSeries(L,ti);return!s||!!s.done}

  const mine=L.po.series.filter(s=>s.a===ti||s.b===ti);if(!mine.length)return true;return mine.some(s=>s.done&&s.w!==ti)}

/* ---------- game engine (quarter by quarter) ---------- */
const lgPace=L=>L.era==='mix'?104:(ERAS[L.era]||{}).pace||104;
function lgTac(a,d,S){let e=0;
  if(a.focus==='inside')e+=S.inside*.3+(d.def==='zone'?-2.2:d.def==='man'?1.2:0);
  else if(a.focus==='perimeter')e+=S.perim*.3+(d.def==='zone'?1.6:d.def==='man'?-1.6:0);
  else e+=.3;
  if(d.def==='press')e+=a.pace==='slow'?-.5:-1.3;
  return e}
function lgPrep(L,h,a,po){

    const chem=chemistry(LG_POS.map(sl=>{const r=st.find(x=>x.slot===sl);return r?r.p:null}),LG_POS,coach);
    return{ti,t,coach,rows,chem,inside:grp(['PF','C']),perim:grp(['PG','SG','SF']),home,bplan:t.bot?lgBotPlan(L,ti,oi):null}};
  return{L,po:!!po,pace:lgPace(L),S:[mk(h,1,a),mk(a,0,h)],score:[0,0],q:[[],[]],used:{},box:[{},{}],plans:[[],[]],rest:[0,0],qn:0}}
function lgQ(G,s,q,plan){const S=G.S[s];const len=q<=4?12:5;let rows;
  if(q<=4){rows=S.rows.map(r=>({r,m:r.min/4}));
    if(G.rest[s]){const st=rows.filter(x=>x.r.st),bn=rows.filter(x=>!x.r.st);if(bn.length){let mv=0;st.forEach(x=>{const d=x.m*.5;x.m-=d;mv+=d});const bt=bn.reduce((a,x)=>a+x.m,0)||1;bn.forEach(x=>x.m+=mv*x.m/bt)}}}

  const drain=(fast&&co.fastfree?1:PACE[plan.pace].d)*(plan.def==='press'?1.25:1)*(co.id==='dev'?.92:1)*(co.fat||1);let so=0,sd=0,sm=0,fgm=0;
  const close=q>=4&&Math.abs(G.score[s]-G.score[1-s])<=6;
  rows.forEach(x=>{const r=x.r;const p=r.p;const tr=traitsOf(p);const has=t=>tr.includes(t);

async function lgSimTo(target){const L=ON.st;if(!L||LUI.sim||!ON.host||!L.solo)return;LUI.sim=true;lgRender();
  const goal=()=>target==='deadline'?(L.phase!=='season'||L.day>=lgDeadline(L)):target==='playoffs'?L.phase!=='season':L.phase==='done';
  let n=0;while(ON.st===L&&LUI.sim&&!goal()){if(!lgRunDay(L)&&L.phase!=='playoffs')break;n++;if(n%2===0){hostCommit();await sleep(60)}}
  LUI.sim=false;if(ON.st===L)hostCommit()}

function lgReward(L,mi){const key=L.id+':'+L.season;const me=L.teams[mi];if(!me)return null;
  const won=L.champ===mi;const ser=L.po?L.po.series.filter(s=>s.a===mi||s.b===mi):[];const sw=ser.filter(s=>s.w===mi).length;const lost=ser.find(s=>s.done&&s.w!==mi);
  const finish=won?'League champions':lost?`Lost in the ${L.po.rounds[lost.round].toLowerCase()}`:'Missed the playoffs';
  if(!P.lgr)P.lgr=[];
  if(!P.lgr.includes(key)){const before=levelInfo(P.xp);const xp=me.w*4+sw*60+(ser.length?40:0)+(won?250:0)+(me.rw||0)*15;gainXP(xp);
    me.roster.forEach(i=>hofAdd(LP(L,i),{s:1,t:won?1:0,m:L.awards&&L.awards.mvp&&L.awards.mvp[0]===i?1:0,f:won&&L.fmvp===i?1:0}));
    recSet('wins',me.w,me.name,`League season ${L.season+1}`);{const rs=lgStatRows(L,L.st,5).filter(r=>r.ti===mi).sort((a,b)=>b.ppg-a.ppg)[0];if(rs)recSet('ppg',rs.ppg,LP(L,rs.i).name,'League')}P.lgr.push(key);P.lgr=P.lgr.slice(-60);
    P.cards.push(...me.roster.map(i=>LP(L,i)).filter(p=>p.era!=='rk'&&!P.cards.includes(p.id)).map(p=>p.id));
    P.history.unshift({date:Date.now(),era:L.era,mode:'league',w:me.w,l:me.l,finish:won?'League champion':`League · ${finish.toLowerCase()}`});P.history=P.history.slice(0,50);
    const got=[];const award=id=>{if(!P.ach.includes(id)){P.ach.push(id);got.push(id)}};
    if(won){award('lgtitle');P.lgTitles=(P.lgTitles||0)+1;dbScore('league_titles',P.lgTitles)}dbEvent('league',{w:me.w,l:me.l,won,roster:me.roster.map(i=>LP(L,i).name)});if(won&&L.teams.some(t=>t.owner&&t.owner!==ON.uid))award('lgonline');if(L.awards&&L.awards.mvp&&me.roster.includes(L.awards.mvp[0]))award('lgmvp');if(me.trades>=3)award('trader');if(P.cards.length>=50)award('cards');
    saveP();refreshNav();const after=levelInfo(P.xp);LUI.rew[key]={xp,after};
    setTimeout(()=>{if(after.lvl>before.lvl)levelUp(after.lvl);got.forEach((id,i)=>setTimeout(()=>{const a=ACH.find(x=>x[0]===id);if(a)toast(a[1],a[2],a[3])},900+i*900));if(won)confetti()},500)}
  return{finish,rec:rec(me),xp:LUI.rew[key]?LUI.rew[key].xp:null,won}}

function lgPickBtn(L,i,attr,on){const p=LP(L,i);const c=lgC(L,i);return `<button class="pick ${on?'on':''}" ${attr}="${i}" style="--c1:${eraOf(p).c1}"><b>${lgOvrTxt(L,i)}</b><span>${esc(p.name)}</span><small>${p.pos}${c[2]?' · out':''}</small></button>`}

    <div class="card"><span class="label">Your trade history</span>${logs.length?`<ul class="news">${logs.map(x=>`<li><span class="ni">${icon(x.ok?'M5 12l5 5L20 7':'M18 6L6 18M6 6l12 12',14)}</span><div>${esc(L.teams[x.from].name)} → ${esc(L.teams[x.to].name)}: ${x.ok?'accepted':'declined'}<small>${x.give.map(i=>esc(LP(L,i).name)).join(', ')} for ${x.get.map(i=>esc(LP(L,i).name)).join(', ')}</small></div></li>`).join('')}</ul>`:'<p class="hint">No trades yet. Bot GMs value players by rating and need every position covered. GM bots drive the hardest bargain.</p>'}</div>

    else if(x.resp&&(x.from===mi))toast(x.ok?'Trade accepted':'Trade declined',`${L.teams[x.to].name} ${x.ok?'accepted':'declined'} your offer`,'M7 7h11l-3-3M17 17H6l3 3')});
  L.trades.forEach(x=>{if(LUI.seenT.has(x.id))return;LUI.seenT.add(x.id);if(x.to===mi)toast('New trade offer',`${L.teams[x.from].name} sent you an offer. See the Trades tab.`,'M7 7h11l-3-3M17 17H6l3 3')});

function lgClockTick(){const L=ON.st;const hc=$('#h2hClock');if(hc&&L&&L.h2h&&!L.h2h.done){const left=Math.max(0,Math.ceil((L.h2h.dl-(Date.now()+(ON.host?0:ON.skew)))/1000));hc.textContent=`Tip in ${left}s`}const el=$('#lgAdv');if(!el||!L||L.solo)return;const now=Date.now()+(ON.host?0:ON.skew);
  const hs=L.teams.filter((t,i)=>t.owner&&!t.off&&!lgOut(L,i));const rd=hs.filter(t=>t.ready).length;let txt=`${rd}/${hs.length} coaches ready`;
  if(L.advAt&&L.advAt>now)txt=`Everyone is ready. Tipping off in ${Math.ceil((L.advAt-now)/1000)}…`;
  else if(L.auto&&L.dayStart){const left=Math.max(0,Math.ceil((L.dayStart+L.auto*1000-now)/1000));txt+=` · auto-advance in ${fmtClock(left)}`}
  el.textContent=txt}

/* ---------- live coaching & replays ---------- */
const LG_T={3:['{p} buries a three from the wing','{p} drains a step-back three','{p} hits the corner three','{p} pulls up from deep and connects','{p} knocks down a catch-and-shoot three'],
  2:['{p} attacks the rim and scores','{p} floats one in over the defense','{p} hits the turnaround jumper','{p} finishes the fast break','{p} scores on a hook in the lane','{p} knocks down the mid-range jumper','{p} hits both free throws','{p} throws it down'],
  1:['{p} makes a free throw','{p} completes the and-one'],
  blk:['{p} swats the shot away','{p} meets the shot at the rim'],stl:['{p} jumps the passing lane for a steal','{p} strips the ball loose'],
  miss:['{p} misses in the paint',"{p} can't get the jumper to fall"],miss3:['{p} misses from deep','{p} comes up short on a three'],reb:['{p} cleans up the glass','{p} pulls down a tough rebound']};
function lgEvents(L,sides,len){const ev=[];
  sides.forEach((list,s)=>list.forEach(({i,pts})=>{const p=LP(L,i);let left=pts;const g3=p.pos==='PG'||p.pos==='SG'?.4:p.pos==='SF'?.28:.08;
    while(left>0){const v=left>=3&&Math.random()<g3?3:left>=2?(Math.random()<.9?2:1):1;left-=v;ev.push({s,i,v})}}));
  const mates=sides.map(list=>list.map(x=>x.i));const fl=Math.round(ev.length*.3);
  for(let k=0;k<fl;k++){const s=Math.random()<.5?0:1;const pool=mates[s].length?mates[s]:mates[1-s];if(!pool.length)break;ev.push({s:mates[s].length?s:1-s,i:pool[Math.random()*pool.length|0],v:0,f:['blk','stl','miss','reb','miss3'][Math.random()*5|0]})}

/* ---------- animated half-court ---------- */
const CT_O=[[150,152],[62,118],[238,118],[108,72],[192,72]];const CT_HOOP=[150,24];
function courtHTML(hc,ac){const dot=(k,c)=>`<g class="cd" id="cd${k}" style="transform:translate(${k<5?CT_O[k][0]:CT_O[k-5][0]}px,${k<5?CT_O[k][1]:CT_O[k-5][1]-30}px)"><circle r="8" fill="${c}"/><circle r="8" fill="none" stroke="#0b1020" stroke-width="2"/></g>`;
  return `<div class="lvcourt" style="${courtStyle()}"><svg viewBox="0 0 300 190" preserveAspectRatio="xMidYMid meet"><rect x="0" y="0" width="300" height="190" rx="10" class="cfloor"/>
   <g fill="none" stroke="rgba(255,248,235,.55)" stroke-width="1.4"><rect x="105" y="0" width="90" height="70"/><circle cx="150" cy="70" r="22"/><path d="M18 0v32a132 132 0 0 0 264 0V0"/><path d="M0 189h300"/><circle cx="150" cy="189" r="22"/></g>
   <path d="M132 14h36" stroke="#fff" stroke-width="2.4"/><circle cx="150" cy="24" r="7" fill="none" stroke="#ff7a3d" stroke-width="2.4" id="cHoop"/>
   ${[0,1,2,3,4].map(k=>dot(k,hc)).join('')}${[5,6,7,8,9].map(k=>dot(k,ac)).join('')}
   <circle r="4.6" id="cBall" fill="#ff8a3d" stroke="#3a1a00" stroke-width="1" style="transform:translate(150px,150px)"/>
   <text id="cPop" x="150" y="52" text-anchor="middle" class="cpop"></text></svg></div>`}
function courtPlay(e,spd){const off=e.s===0?0:5,def=e.s===0?5:0;const t=Math.max(60,240/spd);
  const jit=()=>(Math.random()-.5)*26;const pos=[];
  for(let k=0;k<5;k++){const[x,y]=CT_O[k];const ox=clamp(x+jit(),14,286),oy=clamp(y+jit()*.8,40,176);pos[k]=[ox,oy];
    const d=$('#cd'+(off+k));if(d)d.style.transform=`translate(${ox}px,${oy}px)`;
    const dx=ox+(CT_HOOP[0]-ox)*.22+jit()*.3,dy=oy+(CT_HOOP[1]-oy)*.22;const dd=$('#cd'+(def+k));if(dd)dd.style.transform=`translate(${dx}px,${dy}px)`}
  const ball=$('#cBall');if(!ball)return;const sh=strHash(String(e.i))%5;const ps=(sh+1+(Math.random()*3|0))%5;
  ball.style.transitionDuration=t/1000+'s';ball.style.transform=`translate(${pos[ps][0]}px,${pos[ps][1]}px)`;
  setTimeout(()=>{ball.style.transform=`translate(${pos[sh][0]}px,${pos[sh][1]}px)`},t);
  setTimeout(()=>{if(e.v){ball.style.transform=`translate(${CT_HOOP[0]}px,${CT_HOOP[1]}px)`;setTimeout(()=>{const h=$('#cHoop');if(h){h.classList.remove('flash');void h.getBoundingClientRect();h.classList.add('flash')}
        const p=$('#cPop');if(p){p.textContent='+'+e.v;p.classList.remove('go');void p.getBoundingClientRect();p.classList.add('go')}},t*.8)}
      else if(e.f==='stl'||e.f==='blk'){const k=def+(Math.random()*5|0);const d=$('#cd'+k);if(d)ball.style.transform=d.style.transform}
      else ball.style.transform=`translate(${CT_HOOP[0]+(Math.random()-.5)*30}px,${CT_HOOP[1]+18}px)`},t*2)}

const rivKey=(a,b)=>a<b?a+'-'+b:b+'-'+a;
function lgIsRival(L,a,b){return!!(L&&L.riv&&(L.riv[rivKey(a,b)]||0)>=4)}

/* ---------- clutch moments (solo live games) ---------- */
const CL_OFF={iso:['Isolate your star','Clear out and let your best scorer go to work'],set:['Run a set play','A designed look. Better with a floor general and good chemistry'],kick:['Drive and kick for three','Swing it to a shooter for three. High risk, high reward'],clock:['Milk the clock','Burn time and take a safe look. Fewer chances for them']};
const CL_DEF={deny:['Deny their star','Make anyone else beat you'],switch:['Switch everything','Stay in front, no easy looks'],foul:['Foul to stop the clock','Send them to the line and get the ball back (only when trailing)']};
function lgClutchCtx(LV){const G=LV.G,s=LV.side;const on=x=>[...G.S[x].rows].sort((a,b)=>b.min-a.min).slice(0,5);
  const mine=on(s),theirs=on(1-s);const star=[...mine].sort((a,b)=>b.p.off-a.p.off)[0],ostar=[...theirs].sort((a,b)=>b.p.off-a.p.off)[0];
  const shooter=mine.find(r=>hasT(r.p,'shooter'))||[...mine].sort((a,b)=>(['PG','SG'].includes(b.p.pos))-(['PG','SG'].includes(a.p.pos)))[0];
  const E=r=>Math.max(0,r.E0-(G.used[r.i]||0)*.55);return{mine,theirs,star,ostar,shooter,E,co:G.S[s].coach,oco:G.S[1-s].coach,chem:(G.S[s].chem||{s:0}).s}}
function lgClutchOdds(LV,off,def){const c=lgClutchCtx(LV);const fat=r=>Math.max(0,70-c.E(r))*.004;const cb=c.co.clutch||0;
  const fg=c.mine.some(r=>hasT(r.p,'fg'));const shooters=c.mine.filter(r=>hasT(r.p,'shooter')).length;
  const my={iso:.42+(c.star.p.off-88)*.015+(hasT(c.star.p,'clutch')?.12:0)-fat(c.star),set:.45+c.chem*.015+(fg?.08:0),kick:.34+shooters*.05+(hasT(c.shooter.p,'shooter')?.04:0),clock:.47}[off]+cb;
  let opp=.44+(c.ostar.p.off-88)*.012+(hasT(c.ostar.p,'clutch')?.1:0)+(c.oco.clutch||0);opp-=def==='deny'?.08:def==='switch'?.04:0;if(off==='clock')opp*=.75;
  return{my:clamp(my,.12,.85),opp:clamp(opp,.1,.8),c}}
function lgClutchPanel(LV,L){return new Promise(res=>{const s=LV.side;const d=LV.score[s]-LV.score[1-s];let off='iso',def='deny';
  const draw=()=>{const o=lgClutchOdds(LV,off,def);const c=o.c;
    $('#lvPanelBox').innerHTML=`<span class="label clutch-l">Clutch time · 2:00 left · ${d>0?'you lead by '+d:d<0?'you trail by '+(-d):'all tied'}</span><h3>Your call, coach</h3>
     <div class="clutch-stars"><div>${portrait(c.star.p,'md')}<span class="label">Your closer</span><b>${esc(c.star.p.name)}</b>${traitChips(c.star.p,1)}</div><div>${portrait(c.ostar.p,'md')}<span class="label">Their closer</span><b>${esc(c.ostar.p.name)}</b>${traitChips(c.ostar.p,1)}</div></div>
     <div class="label" style="margin-top:12px">On offense</div><div class="clopts">${Object.entries(CL_OFF).map(([k,[n,t]])=>`<button class="clopt ${off===k?'on':''}" data-co="${k}"><b>${n}</b><small>${t}</small></button>`).join('')}</div>
     <div class="label" style="margin-top:12px">On defense</div><div class="clopts">${Object.entries(CL_DEF).map(([k,[n,t]])=>k==='foul'&&d>=0?'':`<button class="clopt ${def===k?'on':''}" data-cd="${k}"><b>${n}</b><small>${t}</small></button>`).join('')}</div>
     <div class="clodds"><div><span class="label">Your score chance</span><b style="color:var(--win)">${Math.round(o.my*100)}%</b></div><div><span class="label">Their score chance</span><b style="color:var(--loss)">${def==='foul'?'Free throws':Math.round(o.opp*100)+'%'}</b></div></div>
     <div class="actrow"><button class="btn btn-go btn-big" data-clgo>${icon('M13 2L3 14h8l-1 8 10-12h-8z',18)} Run it</button></div>`;
    $$('#lvPanelBox [data-co]').forEach(b=>b.onclick=()=>{off=b.dataset.co;draw()});$$('#lvPanelBox [data-cd]').forEach(b=>b.onclick=()=>{def=b.dataset.cd;draw()});
    $('#lvPanelBox [data-clgo]').onclick=()=>LV.clutchRes&&LV.clutchRes({off,def})};
  LV.clutchRes=v=>{LV.clutchRes=null;$('#lvPanel').hidden=true;res(v)};draw();$('#lvPanel').hidden=false;sfx('whistle');vib(40)})}
function lgClutchResolve(LV,L,off,def){const G=LV.G,s=LV.side,o=lgClutchOdds(LV,off,def),c=o.c;const ev=[];
  const add=(side,r,pts,txt,t)=>{if(pts){G.score[side]+=pts;const qi=G.q[side].length-1;G.q[side][qi]+=pts;const b=G.box[side][r.i];if(b){b[1]+=pts;b[6][qi]=(b[6][qi]||0)+pts}}ev.push({s:side,i:r.i,v:pts,t,txt:'CLUTCH · '+txt,cl:1})};
  const mine=()=>{const made=Math.random()<o.my;let r=off==='kick'?c.shooter:off==='set'?c.mine[Math.random()*c.mine.length|0]:c.star;
      let pts=off==='kick'?3:off==='iso'&&hasT(r.p,'shooter')&&Math.random()<.4?3:2;const nm=last(r.p.name);
      const txt={iso:made?`${nm} isolates and drills it`:`${nm} isolates, but the shot rims out`,set:made?`the set play frees ${nm} for an easy bucket`:`the set play breaks down and ${nm} misses`,kick:made?`${nm} catches the kick-out and buries the three`:`${nm} gets a clean look from three but misses`,clock:made?`${nm} runs the clock down and scores`:`${nm} works the clock but the shot falls short`}[off];
      return[r,made?pts:0,txt]};
  let[r1,p1,t1]=mine();add(s,r1,p1,t1,58);
  if(def==='foul'&&LV.score[s]+p1<LV.score[1-s]+0){const r=c.ostar;let m=0;for(let k=0;k<2;k++)if(Math.random()<.76)m++;add(1-s,r,m,`intentional foul, ${last(r.p.name)} makes ${m} of 2`,31);
    const[r2,p2,t2]=mine();add(s,r2,p2,t2,9)}
  else{const made=Math.random()<o.opp;const r=c.ostar;const pts=made?(hasT(r.p,'shooter')&&Math.random()<.4?3:2):0;
    add(1-s,r,pts,made?`${last(r.p.name)} answers at the other end`:`${def==='deny'?'Denied!':'Great defense!'} ${last(r.p.name)} can't get it to go`,24)}
  return ev}

/* ---------- live head-to-head (online, when two human GMs meet) ---------- */
let H2HG=null;
function lgAdvance(L){if(L.h2h)return;const games=lgDayGames(L);
  const gi=L.solo?-1:games.findIndex(([h,a])=>L.teams[h].owner&&L.teams[a].owner&&!L.teams[h].off&&!L.teams[a].off);
  if(gi<0){lgRunDay(L);return}
  L.teams.forEach((t,ti)=>{if(t.bot)lgBotPrep(L,ti)});const[h,a]=games[gi];H2HG=lgPrep(L,h,a,L.phase==='playoffs');
  L.h2h={gi,h,a,q:0,sc:[0,0],qs:[[],[]],calls:[{...L.teams[h].plan.p1},{...L.teams[a].plan.p1}],rd:[0,0],dl:Date.now()+25000,box:[[],[]],done:0,id:rid()};
  L.advAt=0;L.teams.forEach(t=>t.ready=0);lgNews(L,`Live now: ${L.teams[a].name} at ${L.teams[h].name}, coached in real time`,'live')}
function lgH2HStep(L){const X=L.h2h;const G=H2HG;if(!X||!G||X.done)return;const q=X.q+1;
  G.plans[0][q-1]=lgCleanPlan({p1:X.calls[0]}).p1;G.plans[1][q-1]=lgCleanPlan({p1:X.calls[1]}).p1;G.rest=[0,0];lgSimQ(G,q);
  X.q=q;X.sc=[...G.score];X.qs=[[...G.q[0]],[...G.q[1]]];X.rd=[0,0];
  X.box=[0,1].map(s=>Object.entries(G.box[s]).map(([i,b])=>[+i,Math.round(b[0]),b[1],b[2],b[3],Array.from(b[6],v=>v||0)]));
  if((q>=4&&G.score[0]!==G.score[1])||q>=10){X.done=1;X.until=Date.now()+9000;X.result=lgFinish(G);X.sc=[X.result.hs,X.result.as];X.qs=X.result.q}
  else X.dl=Date.now()+25000}
function lgH2HTick(L){const X=L.h2h;if(!X)return false;const now=Date.now();
  if(!H2HG&&!X.done){/* host reloaded mid-game: finish it as a normal sim */const r=lgPlay(L,X.h,X.a,L.phase==='playoffs');L.h2h=null;lgRunDay(L,{[X.gi]:r});hostCommit();return true}
  if(X.done){if(now>=X.until){const r=X.result;L.h2h=null;H2HG=null;lgRunDay(L,{[X.gi]:r});hostCommit()}return true}
  const offA=L.teams[X.h].off,offB=L.teams[X.a].off;
  if((X.rd[0]||offA)&&(X.rd[1]||offB)||now>=X.dl){lgH2HStep(L);hostCommit()}return true}
function lgH2HView(L,mi){const X=L.h2h;const s=X.h===mi?0:X.a===mi?1:-1;const H=L.teams[X.h],A=L.teams[X.a];const key='h2h:'+X.id;
  if(LUI.key!==key||!$('#h2hv')){LUI.h2hQ=0;
    lgPaint(key,`<div id="h2hv"><div class="draft-top"><button class="btn btn-ghost" data-leave>${icon('M19 12H5M11 18l-6-6 6-6')} Leave</button><div><span class="label live-l">● Live head-to-head · coached in real time</span><h2>${esc(A.name)} at ${esc(H.name)}</h2></div><div class="meta">${rxBar()}</div></div>
     <div class="lv-board"><div class="lv-team">${avFor(H.name,H.g,'mid')}<div><b>${esc(H.name)}</b><small>${esc(H.oname||'')} · home</small></div></div>
      <div class="lv-score"><b id="lvS0">${X.sc[0]}</b><div class="lv-mid"><span id="lvQ">${X.q?'End Q'+X.q:'Tip-off'}</span><span id="lvClock">12:00</span></div><b id="lvS1">${X.sc[1]}</b></div>
      <div class="lv-team r">${avFor(A.name,A.g,'mid')}<div><b>${esc(A.name)}</b><small>${esc(A.oname||'')} · away</small></div></div></div>
     <div class="lvcrowd" id="lvCrowd"></div>${courtHTML(tcol(H),tcol(A))}<div class="tbl-wrap" id="lvLine"></div>
     <div class="lv-grid"><div class="card" id="h2hCall"></div><div class="card"><span class="label">Play-by-play</span><ul class="lv-feed" id="lvFeed"></ul></div></div></div>`,true);
    lgCommon()}
  const LV={h:X.h,a:X.a,side:Math.max(0,s),score:[...X.sc],q:X.q,run:{n:0}};crowdDraw(LV,L);
  $('#lvLine').innerHTML=`<table class="lvline"><tr><th></th>${[0,1,2,3].concat(X.qs[0].length>4?[4]:[]).map(k=>`<th class="n">${k<4?'Q'+(k+1):'OT'}</th>`).join('')}<th class="n">T</th></tr>${[[H,0],[A,1]].map(([T,k])=>`<tr><td>${esc(T.name)}</td>${[0,1,2,3].concat(X.qs[0].length>4?[4]:[]).map(j=>`<td class="n">${X.qs[k][j]!=null?X.qs[k][j]:''}</td>`).join('')}<td class="n"><b>${X.sc[k]}</b></td></tr>`).join('')}</table>`;
  if(X.q>LUI.h2hQ){const q=X.q;const prev=LUI.h2hQ;LUI.h2hQ=q;if(prev>=0&&q>0)lgH2HAnimate(L,X,q)}
  const call=$('#h2hCall');if(!call)return;
  if(X.done){const won=s<0?null:(s===0?X.sc[0]>X.sc[1]:X.sc[1]>X.sc[0]);call.innerHTML=`<span class="label">Final</span><h3 class="ttl">${won===true?'Victory':won===false?'Defeat':'Final'}</h3><p class="mutep">${esc(H.name)} ${X.sc[0]} · ${esc(A.name)} ${X.sc[1]}. The rest of the day plays in a few seconds.</p>`;if(won&&!LUI.h2hCheer){LUI.h2hCheer=1;confetti();sfx('cheer')}return}
  LUI.h2hCheer=0;
  if(s<0){call.innerHTML=`<span class="label">Spectating</span><p class="mutep">${esc(H.oname||H.name)} and ${esc(A.oname||A.name)} are making calls each quarter.</p><p class="hint" id="h2hClock"></p>`;return}
  const mine=X.calls[s],rd=X.rd[s],ord=X.rd[1-s];const qn=X.q+1;
  call.innerHTML=`<span class="label">${qn>4?'Overtime':['','1st','2nd','3rd','4th'][qn]+' quarter'} call · ${rd?'locked in':'choose and lock in'}</span>
    ${lgPlanGroups('data-hc',mine,rd)}<div class="actrow"><button class="btn ${rd?'btn-ghost':'btn-go'}" data-hready>${rd?'Locked in · tap to change':'Lock in call'}</button><span class="hint" id="h2hClock"></span></div>

  $$('#h2hCall [data-hc]').forEach(b=>b.onclick=()=>{const v={...mine,[b.dataset.k]:b.dataset.v};lgDo({t:'call',v,rd:0})});
  $('#h2hCall [data-hready]').onclick=()=>lgDo({t:'call',v:mine,rd:rd?0:1})}
async function lgH2HAnimate(L,X,q){const sides=X.box.map(bx=>bx.map(r=>({i:r[0],pts:(r[5]||[])[q-1]||0})).filter(x=>x.pts>0));
  const ev=lgEvents(L,sides,q<=4?12:5);const sc=[X.qs[0].slice(0,q-1).reduce((a,b)=>a+b,0),X.qs[1].slice(0,q-1).reduce((a,b)=>a+b,0)];const LV={h:X.h,a:X.a,score:sc,mom:0,run:{s:-1,n:0},q};
  const id=X.id;for(const e of ev){if(!ON.st||!ON.st.h2h||ON.st.h2h.id!==id)return;if(e.v){LV.score[e.s]+=e.v}
    lgLvDraw(LV,L,e);courtPlay(e,4);if(e.v)sfx(e.v===3?'swish3':'swish');await sleep(110)}
  const qe=$('#lvQ');if(qe)qe.textContent=`End ${q<=4?'Q'+q:'OT'}`;sfx('buzzer')}

/* ======================= LEAGUE DEPTH: fog, salary cap, offseason, commissioner ======================= */
function lgEnsure(L){if(!L||L.kind!=='league')return L;const d={cap:false,sal:{},cg:{},devO:{},devD:{},devRev:0,rules:{decade:0,approve:0},pend:[],riv:{},rx:[],rxSeq:0,off:null};
  for(const k in d)if(L[k]===undefined)L[k]=d[k];if(!L.rules.decade&&L.rules.decade!==0)L.rules.decade=0;return L}
/* ---------- scouting fog: rookies show a range until they have played 5 games ---------- */
function lgFogged(L,i){const p=LP(L,i);return p.era==='rk'&&(((L.cg||{})[i])||0)<5}
function lgFogRange(L,i){const p=LP(L,i);const c=p.ovr+((strHash(p.id)%7)-3);return[c-4,c+4]}
function lgFogTxt(L,i){if(!lgFogged(L,i))return LP(L,i).ovr;const[a,b]=lgFogRange(L,i);return `<span class="fog" title="Scouting range. The true rating shows after 5 games.">${a}–${b}</span>`}
function lgSeenOvr(L,i,skill){if(skill!=='gm'&&lgFogged(L,i)){const[a,b]=lgFogRange(L,i);return(a+b)/2}return LP(L,i).ovr}
/* ---------- decade limit rule ---------- */
function lgDecadeOk(L,roster,add,drop){const n=L.rules&&L.rules.decade;if(!n)return true;const after=roster.filter(i=>!(drop||[]).includes(i)).concat(add||[]);
  const c={};for(const i of after){const e=LP(L,i).era;if(e==='rk')continue;c[e]=(c[e]||0)+1;if(c[e]>n)return false}return true}
/* ---------- salary cap & contracts ---------- */
const LG_CAP=210;
const lgAsk=(L,i)=>Math.max(1,Math.round(1+Math.pow(Math.max(0,LP(L,i).ovr-72),2)/12));
const lgSal=(L,i)=>L.sal&&L.sal[i]?L.sal[i][0]:lgAsk(L,i);
const lgYears=(L,i)=>L.sal&&L.sal[i]?L.sal[i][1]:0;
const lgPayroll=(L,t)=>t.roster.reduce((a,i)=>a+lgSal(L,i),0);
function lgContract(L,i,rookie){if(!L.cap)return;L.sal[i]=[rookie?Math.max(1,Math.round(lgAsk(L,i)*.7)):lgAsk(L,i),rookie?3:1+(strHash(L.seed+':'+i)%4)]}
function lgCanSign(L,ti,i){const t=L.teams[ti];if(t.roster.length>=LG.MAX)return'Roster full';if(!lgDecadeOk(L,t.roster,[i]))return'Decade limit';
  if(L.cap&&lgPayroll(L,t)+lgAsk(L,i)>LG_CAP)return'Over the cap';return''}
function lgCapTradeOk(L,ai,bi,ga,gb){if(!L.cap)return true;const A=L.teams[ai],B=L.teams[bi];const out=x=>x.reduce((s,i)=>s+lgSal(L,i),0);
  const pa=lgPayroll(L,A)-out(ga)+out(gb),pb=lgPayroll(L,B)-out(gb)+out(ga);
  if(pa>LG_CAP&&out(gb)>out(ga)*1.25+2)return false;if(pb>LG_CAP&&out(ga)>out(gb)*1.25+2)return false;return true}
const money=v=>`$${Math.round(v)}M`;

/* ---------- offseason: training points and re-signing ---------- */
function lgOffseasonStart(L){L.phase='offseason';const tp={},exp=[];
  L.teams.forEach((t,ti)=>{tp[ti]=3+(t.coach==='dev'?1:0);t.ready=0});
  if(L.cap){Object.keys(L.sal).forEach(k=>{L.sal[k][1]--});L.teams.forEach((t,ti)=>t.roster.forEach(i=>{if(L.sal[i]&&L.sal[i][1]<=0)exp.push({i,ti,ask:lgAsk(L,i)})}))}
  L.off={tp,used:{},exp};
  L.teams.forEach((t,ti)=>{if(!t.bot)return;
    const young=[...t.roster].filter(i=>LP(L,i).era==='rk').sort((a,b)=>LP(L,b).ovr-LP(L,a).ovr);
    let guard=0;while(L.off.tp[ti]>0&&guard++<20){const i=young[guard%Math.max(1,young.length)]??t.roster[0];if(!lgTrain(L,ti,i,LP(L,i).off<LP(L,i).def?'off':'def'))break}
    L.off.exp.filter(x=>x.ti===ti).forEach(x=>{const med=[...t.roster].map(j=>LP(L,j).ovr).sort((a,b)=>a-b)[t.roster.length>>1];
      lgResign(L,ti,x.i,LP(L,x.i).ovr>=med&&lgPayroll(L,t)-lgSal(L,x.i)+x.ask<=LG_CAP)})});
  lgNews(L,`Offseason: ${L.cap?'contracts are up and ':''}every team has training points to spend.`,'info')}
function lgTrainCost(L,i){return LP(L,i).era==='rk'?1:2}
function lgTrain(L,ti,i,k){const O=L.off;const t=L.teams[ti];if(!O||L.phase!=='offseason'||!t.roster.includes(i)||!['off','def'].includes(k))return false;
  const c=lgTrainCost(L,i);if((O.tp[ti]||0)<c)return false;const u=O.used[i]||0;if(u>=3)return false;
  O.tp[ti]-=c;O.used[i]=u+1;const m=k==='off'?L.devO:L.devD;m[i]=(m[i]||0)+1;L.devRev=(L.devRev||0)+1;return true}
function lgResign(L,ti,i,ok){const O=L.off;if(!O)return false;const x=O.exp.find(e=>e.i===i&&e.ti===ti);if(!x)return false;const t=L.teams[ti];
  O.exp=O.exp.filter(e=>e!==x);
  if(ok&&lgPayroll(L,t)-lgSal(L,i)+x.ask<=LG_CAP){L.sal[i]=[x.ask,2+(strHash(i+':'+L.season)%2)];lgNews(L,`${t.name} re-sign ${LP(L,i).name} for ${money(x.ask)} a year`,'tx')}
  else{t.roster=t.roster.filter(j=>j!==i);delete L.sal[i];lgFix(L,t);lgNews(L,`${LP(L,i).name} leaves ${t.name} in free agency`,'tx')}
  return true}
function lgStartRookieDraft(L){if(L.phase!=='offseason')return;(L.off&&L.off.exp||[]).slice().forEach(x=>{const t=L.teams[x.ti];lgResign(L,x.ti,x.i,lgPayroll(L,t)-lgSal(L,x.i)+x.ask<=LG_CAP)});
  L.teams.forEach(t=>{while(t.roster.length<LG.MIN){const f=lgFA(L).sort((a,b)=>LP(L,a).ovr-LP(L,b).ovr)[0];if(f===undefined)break;t.roster.push(f);lgContract(L,f)}lgFix(L,t);t.ready=0});
  L.off=null;const order=lgStandingsPrev(L);L.draft={order,rk:1,n:0,log:[]};L.phase='draft';lgSkipFull(L);
  lgNews(L,`Season ${L.season+1}: the rookie draft is on the clock. Worst record picks first.`,'info');
  if(L.draft.n>=L.draft.order.length||!lgDraftAvail(L).length)lgDraftDone(L);else L.dl=L.timer?Date.now()+L.timer*1000:0}
function lgStandingsPrev(L){const h=L.hist[0];if(!h||!h.rec)return L.teams.map((_,i)=>i);return L.teams.map((_,i)=>i).sort((a,b)=>((h.rec[a]||[0,0])[0]-(h.rec[a]||[0,0])[1])-((h.rec[b]||[0,0])[0]-(h.rec[b]||[0,0])[1]))}
function lgOffseasonPanel(L,mi){const O=L.off;const t=L.teams[mi];const pts=O?O.tp[mi]||0:0;
  const mine=O?O.exp.filter(x=>x.ti===mi):[];const hs=L.teams.filter(x=>x.owner&&!x.off);const rd=hs.filter(x=>x.ready).length;
  const rows=[...t.roster].sort((a,b)=>(LP(L,a).era==='rk'?0:1)-(LP(L,b).era==='rk'?0:1)||LP(L,b).ovr-LP(L,a).ovr).map(i=>{const p=LP(L,i);const c=lgTrainCost(L,i);const u=O.used[i]||0;const can=pts>=c&&u<3;
    return `<div class="trainrow">${portrait(p,'xs')}<div class="tr-n"><b>${esc(p.name)}</b><small>${p.pos} · ${lgFogTxt(L,i)} · O${p.off} D${p.def}${p.era==='rk'?' · rookie':''}${u?` · trained ×${u}`:''}</small></div>
     <button class="mini" data-train="${i}:off" ${can?'':'disabled'}>+1 OFF</button><button class="mini" data-train="${i}:def" ${can?'':'disabled'}>+1 DEF</button><span class="mono tc">${c} pt${c>1?'s':''}</span></div>`}).join('');
  return `<div class="lg-grid"><div class="stack"><div class="card"><div class="section-h" style="margin:0 0 8px"><span class="label">Offseason training</span><span class="tp">${pts} point${pts===1?'':'s'} left</span></div>
     <p class="hint" style="margin:0 0 10px">Rookies cost 1 point, veterans 2. Each player can train up to 3 times. Every season rookies also grow on their own, and veterans may slip.</p><div class="trainlist">${rows}</div></div></div>
   <div class="stack">${L.cap?`<div class="card"><span class="label">Expiring contracts · payroll ${money(lgPayroll(L,t))} of ${money(LG_CAP)}</span>${mine.length?mine.map(x=>{const p=LP(L,x.i);const fits=lgPayroll(L,t)-lgSal(L,x.i)+x.ask<=LG_CAP;
       return `<div class="offer"><b>${esc(p.name)}</b><span class="hint">${p.pos} · ${p.ovr} · asking ${money(x.ask)} a year${fits?'':' · would put you over the cap'}</span><div class="actrow" style="margin-top:2px"><button class="btn btn-go" data-resign="${x.i}:1" ${fits?'':'disabled'}>Re-sign</button><button class="btn btn-ghost" data-resign="${x.i}:0">Let him walk</button></div></div>`}).join(''):'<p class="hint">No expiring contracts on your team.</p>'}</div>`:''}
    <div class="card"><span class="label">Up next: rookie draft</span><p class="mutep">A fresh class of 8 rookies. Their ratings are a scouting range until they play.</p>
     ${L.solo?`<div class="actrow"><button class="btn btn-go" data-rookie>Start the rookie draft</button></div>`:`<div class="actrow"><button class="btn ${t.ready?'btn-ghost':'btn-go'}" data-ready="${t.ready?0:1}">${t.ready?'Ready · tap to change':'I’m done, ready up'}</button>${ON.host?'<button class="btn btn-ghost" data-rookie>Start now</button>':''}<span class="hint">${rd}/${hs.length} GMs ready</span></div>`}</div></div></div>`}

const monthKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const monthName=()=>new Date().toLocaleDateString(undefined,{month:'long'});
const PASS_XP=350,PASS_N=30;
GRADS.push(['#ff4d6d','#ffd166'],['#00f5d4','#9b5de5'],['#f15bb5','#fee440'],['#c0c0c0','#5c677d'],['#ffd700','#b8860b'],['#00bbf9','#00f5d4'],['#e63946','#1d3557'],['#7cff6b','#00b4d8']);
const BASE_GRADS=6;
const COURTS={maple:['Classic maple','#b9824e','#c48a52','#b97f49'],night:['Night court','#1b2a4a','#22345c','#1e2f54'],retro:['Retro parquet','#9c5f2e','#a86a36','#8f5629'],neon:['Neon arena','#2b1452','#341a63','#2d1658'],black:['Blacktop','#2a2d33','#30333a','#282b31'],gold:['Gold floor','#a8862e','#b8963a','#9c7c28']};

const PASS_REWARDS=(()=>{const r=[];let g=BASE_GRADS,t=1,c=['night','retro','neon','black','gold'],ci=0;
  for(let k=1;k<=PASS_N;k++){if(k%5===0&&ci<c.length)r.push({k,type:'court',v:c[ci++]});else if(k%3===0&&t<TITLES.length)r.push({k,type:'title',v:TITLES[t++]});else if(k%2===0&&g<GRADS.length)r.push({k,type:'grad',v:g++});else r.push({k,type:'xp',v:100+k*10})}return r})();
function passState(){if(!P.pass||P.pass.id!==monthKey())P.pass={id:monthKey(),xp:0,claimed:[]};return P.pass}
const passTier=()=>Math.min(PASS_N,Math.floor(passState().xp/PASS_XP));
function unlocks(){if(!P.unl)P.unl={grad:[],court:['maple'],title:['Rookie']};return P.unl}
function gainXP(x){x=Math.max(0,Math.round((x||0)*(typeof liveXpMult==='function'?liveXpMult():1)));P.xp+=x;if(x>0)P.tix=(P.tix||0)+Math.max(1,Math.round(x/8));const ps=passState();const before=passTier();ps.xp+=x;const after=passTier();
  for(let k=before+1;k<=after;k++){const r=PASS_REWARDS[k-1];if(!r)continue;const u=unlocks();
    if(r.type==='grad'&&!u.grad.includes(r.v))u.grad.push(r.v);if(r.type==='court'&&!u.court.includes(r.v))u.court.push(r.v);if(r.type==='title'&&!u.title.includes(r.v))u.title.push(r.v);if(r.type==='xp')P.xp+=r.v;
    setTimeout(()=>toast(`Pass tier ${k} unlocked`,passRewardName(r),'M12 2l3 7h7l-5.5 4.5 2 7.5-6.5-4.5L5.5 21l2-7.5L2 9h7z'),1600+(k-before)*500)}
  return x}
function passRewardName(r){return r.type==='grad'?'New profile and team color':r.type==='court'?`Court style: ${COURTS[r.v][0]}`:r.type==='title'?`Profile title: ${r.v}`:`Bonus ${r.v} XP`}
function openPass(){const ps=passState();const tier=passTier();const into=ps.xp-tier*PASS_XP;
  lgOpenModal(`<span class="label">Season pass · ${monthName()} · resets on the 1st</span><h2 class="mtitle">Tier ${tier} of ${PASS_N}</h2>
   <div class="xpbar"><i style="width:${tier>=PASS_N?100:into/PASS_XP*100}%"></i></div><p class="hint">${tier>=PASS_N?'Pass complete. Legendary.':`${PASS_XP-into} XP to tier ${tier+1}. Every XP you earn in any mode counts.`}</p>
   <div class="passgrid">${PASS_REWARDS.map(r=>{const got=r.k<=tier;const sw=r.type==='grad'?`<span class="av" style="--g1:${GRADS[r.v][0]};--g2:${GRADS[r.v][1]}"></span>`:r.type==='court'?`<span class="cswatch" style="background:${COURTS[r.v][1]}"></span>`:r.type==='title'?icon('M4 7h16M4 12h10M4 17h7',18):icon('M13 2L3 14h8l-1 8 10-12h-8z',18);
     return `<div class="ptile ${got?'got':''} ${r.k===tier+1?'next':''}" style="animation-delay:${r.k*18}ms"><span class="pk">${r.k}</span>${sw}<small>${esc(r.type==='title'?r.v:r.type==='court'?COURTS[r.v][0]:r.type==='grad'?'Color':'+'+r.v+' XP')}</small></div>`}).join('')}</div>
   <p class="hint">Equip titles, colors and court styles from Edit profile.</p>`,true)}
function courtStyle(){const c=COURTS[P.court]||COURTS.maple;return `--cf:${c[1]};--cs1:${c[2]};--cs2:${c[3]}`}

const REC_LBL={pts:'Most points in a game',ppg:'Best season scoring average',wins:'Most wins in a season',streak:'Longest win streak',margin:'Biggest win',gauntlet:'Deepest Gauntlet run',daily:'Longest daily streak'};
function recSet(k,v,who,ctx){if(!P.rec)P.rec={};const r=P.rec[k];if(r&&r.v>=v)return false;P.rec[k]={v:+(+v).toFixed(1),who,ctx,d:Date.now()};if(r)setTimeout(()=>toast('New record',`${REC_LBL[k]}: ${(+v).toFixed(k==='ppg'?1:0)}${who?' · '+who:''}`,'M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z'),2200);return true}
function hofAdd(p,f){if(!p||p.era==='rk')return;if(!P.hof)P.hof={};const h=P.hof[p.name]||(P.hof[p.name]={t:0,m:0,f:0,s:0,era:p.era,pos:p.pos});for(const k in f)h[k]=(h[k]||0)+f[k];
  const was=h.in;h.in=h.t>=2||h.m>=1||h.f>=1||h.s>=6;if(h.in&&!was){h.ind=Date.now();setTimeout(()=>{toast('Hall of Fame',`${p.name} has been inducted into your Hall of Fame`,'M6 3h12v14l-6-4-6 4z');sfx('chime')},2600)}}
function openHof(tab){tab=tab||'hof';const H=Object.entries(P.hof||{});const ind=H.filter(([,h])=>h.in).sort((a,b)=>(b[1].t*3+b[1].m*4+b[1].f*2+b[1].s)-(a[1].t*3+a[1].m*4+a[1].f*2+a[1].s));
  const ballot=H.filter(([,h])=>!h.in).sort((a,b)=>(b[1].t+b[1].s)-(a[1].t+a[1].s)).slice(0,6);
  const sc=h=>h.w+({Champions:60,'Lost in Finals':40,'Lost in conference finals':25,'Lost in semifinals':12,'Lost in first round':5}[h.finish]||0)+({legend:25,pro:10,casual:0}[h.diff]||0);
  const best=[...P.history].filter(h=>MODES[h.mode]).sort((a,b)=>sc(b)-sc(a)).slice(0,10);
  const accol=h=>[h.t?`${h.t} title${h.t>1?'s':''}`:'',h.m?`${h.m} MVP`:'',h.f?`${h.f} Finals MVP`:'',`${h.s} season${h.s>1?'s':''}`].filter(Boolean).join(' · ');
  const body={hof:ind.length?`<div class="hofgrid">${ind.map(([n,h],k)=>{const p={name:n,era:h.era,pos:h.pos};return `<div class="hofcard" style="animation-delay:${k*60}ms">${portrait(p,'md')}<b>${esc(n)}</b><small>${(ERAS[h.era]||{}).full||''} · ${h.pos}</small><span class="hint">${accol(h)}</span></div>`}).join('')}</div>`:'<p class="mutep">Nobody yet. Players get inducted after 2 titles, an MVP or Finals MVP, or 6 seasons on your teams.</p>'
     +(ballot.length?`<div class="label" style="margin-top:16px">On the ballot</div><div class="ballot">${ballot.map(([n,h])=>`<span class="tag">${esc(n)} · ${accol(h)}</span>`).join('')}</div>`:''),
    rec:`<div class="recs">${Object.entries(REC_LBL).map(([k,l])=>{const r=(P.rec||{})[k];return `<div class="rec ${r?'':'empty'}"><span class="label">${l}</span><b>${r?(k==='ppg'?r.v.toFixed(1):r.v):'–'}</b><small>${r?esc([r.who,r.ctx].filter(Boolean).join(' · ')):'Not set yet'}</small></div>`}).join('')}</div>`,
    best:best.length?`<div class="tbl-wrap"><table><tr><th>#</th><th>Finish</th><th>Era</th><th>Mode</th><th class="n">Record</th><th class="n">Score</th></tr>${best.map((h,i)=>`<tr ${i===0?'class="me"':''}><td>${i+1}</td><td>${esc(h.finish)}</td><td>${(ERAS[h.era]||{}).full||''}</td><td>${modeName(h.mode)} · ${DIFF[h.diff]?DIFF[h.diff].n:''}</td><td class="n">${h.w}–${h.l}</td><td class="n">${sc(h)}</td></tr>`).join('')}</table></div>`:'<p class="mutep">Finish a season to rank it here.</p>'}[tab];
  lgOpenModal(`<span class="label">Your legacy</span><h2 class="mtitle">Hall of Fame</h2><div class="otabs three">${[['hof','Inductees'],['rec','Records'],['best','Best seasons']].map(([k,n])=>`<button data-ht="${k}" class="${tab===k?'on':''}">${n}</button>`).join('')}</div><div class="actrow" style="margin-top:10px"><button class="btn btn-ghost" id="hofGlobal" onclick="openBoards()">Global leaderboards · everyone</button></div><div style="margin-top:14px">${body}</div>`,true);
  $$('#modalBox [data-ht]').forEach(b=>b.onclick=()=>openHof(b.dataset.ht))}
