/* ---------- share cards ---------- */
function shareCard(o){const W=1080,H=1350;const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');if(!x)return null;
  const acc=o.accent||'#ffb547';const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#141c36');g.addColorStop(1,'#0b1020');x.fillStyle=g;x.fillRect(0,0,W,H);
  const rg=x.createRadialGradient(W*.8,120,10,W*.8,120,700);rg.addColorStop(0,acc+'55');rg.addColorStop(1,'transparent');x.fillStyle=rg;x.fillRect(0,0,W,H);
  x.strokeStyle='rgba(255,255,255,.06)';x.lineWidth=2;for(let k=0;k<14;k++){x.beginPath();x.arc(W/2,H+200,200+k*90,Math.PI,2*Math.PI);x.stroke()}
  const D='"Big Shoulders Display", Impact, "Arial Narrow", sans-serif',B='Barlow, "Segoe UI", Arial, sans-serif',M='"IBM Plex Mono", Menlo, monospace';
  x.fillStyle='#ffb547';x.font=`900 64px ${D}`;x.fillText('HALL',72,120);x.fillStyle='#eef1f8';x.fillText('PASS',72+x.measureText('HALL').width+6,120);
  x.fillStyle='#8f9abb';x.font=`600 30px ${M}`;x.fillText((o.kicker||'').toUpperCase(),72,240);
  x.fillStyle=acc;x.font=`900 ${o.title&&o.title.length>14?120:160}px ${D}`;wrapText(x,(o.title||'').toUpperCase(),72,400,W-144,o.title&&o.title.length>14?118:150);
  x.fillStyle='#eef1f8';x.font=`500 40px ${B}`;let y=o.title&&o.title.length>14?690:620;y=wrapText(x,o.sub||'',72,y,W-144,52)+40;
  (o.lines||[]).slice(0,7).forEach((l,k)=>{x.fillStyle='rgba(255,255,255,.06)';roundRect(x,72,y+k*96,W-144,80,18);x.fill();x.fillStyle='#eef1f8';x.font=`600 34px ${B}`;x.fillText(l[0],104,y+k*96+52);
    x.fillStyle=acc;x.font=`800 40px ${D}`;const t=String(l[1]||'');x.fillText(t,W-104-x.measureText(t).width,y+k*96+54)});
  x.fillStyle='#8f9abb';x.font=`500 26px ${M}`;x.fillText(`${P.signed?P.name+' · ':''}${new Date().toLocaleDateString()}`,72,H-70);
  try{return c.toDataURL('image/png')}catch(e){return null}}
function roundRect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}
function wrapText(x,t,a,b,w,lh){const words=String(t).split(' ');let line='',y=b;for(const wd of words){const test=line?line+' '+wd:wd;if(x.measureText(test).width>w&&line){x.fillText(line,a,y);line=wd;y+=lh}else line=test}if(line)x.fillText(line,a,y);return y}
function openShare(o){const url=shareCard(o);const txt=[`Hall Pass · ${o.kicker||''}`,o.title,o.sub,...(o.lines||[]).map(l=>`${l[0]}: ${l[1]}`)].filter(Boolean).join('\n');
  lgOpenModal(`<span class="label">Share card</span><h2 class="mtitle">Show it off</h2>${url?`<img class="sharecard" src="${url}" alt="${esc(o.title||'Result card')}">`:'<p class="mutep">Your browser could not draw the image, but you can still copy the text.</p>'}
   <div class="actrow">${url?`<a class="btn btn-go" href="${url}" download="hallpass-${Date.now()}.png" id="shSave">${icon('M12 3v12M7 10l5 5 5-5M5 21h14',16)} Save image</a>`:''}${navigator.share?'<button class="btn btn-ghost" id="shNative">Share…</button>':''}<button class="btn btn-ghost" id="shCopy">Copy text</button></div><p class="hint" id="shMsg">On a phone you can also press and hold the image to save it.</p>`,true);
  const cp=$('#shCopy');if(cp)cp.onclick=async()=>{try{await navigator.clipboard.writeText(txt);$('#shMsg').textContent='Copied.'}catch(e){$('#shMsg').textContent=txt}};
  const nv=$('#shNative');if(nv)nv.onclick=async()=>{try{if(url&&navigator.canShare){const b=await (await fetch(url)).blob();const f=new File([b],'hallpass.png',{type:'image/png'});if(navigator.canShare({files:[f]})){await navigator.share({files:[f],text:txt});return}}await navigator.share({text:txt})}catch(e){}};
  sfx('flip')}

/* ======================= MODES: daily challenge, gauntlet, mini-games ======================= */
const dayKey=(off=0)=>{const d=new Date();d.setDate(d.getDate()+off);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const BOSSES=['The Dynasty','Midtown Menace','Ironvale Juggernauts','The Night Shift','Sun Mesa Superteam','Velvet Thunder','Granite Giants'];
function dailyCfg(key){key=key||dayKey();const h=strHash('daily:'+key);const eras=[...ERA_ORDER,'mix','mix'];
  const o=typeof liveBoss==='function'?liveBoss(key):null;
  return{key,seed:h,era:eras[h%eras.length],rr:h%4,boss:o?o.boss:BOSSES[(h>>>4)%BOSSES.length],rating:o?+o.rating:+(89.4+((h>>>8)%30)/10).toFixed(1),diff:'pro'}}
function dailyState(){if(!P.daily)P.daily={last:'',streak:0,best:0,won:''};return P.daily}
function startDaily(){const c=dailyCfg();Object.assign(S,{era:c.era,mode:'classic',diff:c.diff,challenge:null,daily:c.key,gauntlet:false});startDraft();S.rerolls=c.rr;renderDraft()}
function seededCands(slot,fn){if(!S.daily)return fn();const c=dailyCfg(S.daily);const prev=R;R=mulberry32((c.seed+SLOTS.indexOf(slot)*997+(3-S.rerolls)*31)>>>0);try{return fn()}finally{R=prev}}
async function runSeries(opts){/* generic animated series screen used by daily + gauntlet */
  const{title,kicker,me,opp,bo,pace}=opts;const need=Math.ceil(bo/2);let wa=0,wb=0;const games=[];
  while(wa<need&&wb<need){const g=playGame(me.rating,opp.rating,pace);games.push(g);g.aWin?wa++:wb++}
  return{games,won:wa===need,wa,wb}}
async function runDaily(){const c=dailyCfg(S.daily);const t=teamCalc(S.roster,S.coach,true);const me={rating:t.rating};const opp={rating:c.rating};
  const res=await runSeries({me,opp,bo:7,pace:c.era==='mix'?104:ERAS[c.era].pace});const my=RUN+1;RUN=my;
  $('#app').innerHTML=`<section class="view"><div class="wrap"><div class="draft-top"><button class="btn btn-ghost" onclick="go('home')">${icon('M19 12H5M11 18l-6-6 6-6')} Home</button><div><span class="label">Daily challenge · ${c.key}</span><h2>vs ${esc(c.boss)}</h2></div><div class="meta"><span class="tag">They're rated ${c.rating}</span><span class="tag">You: ${t.rating.toFixed(1)}</span></div></div>
   <div class="sd-grid"><div class="sdc mine" id="dly"><div class="row" data-k="a">${avHTML()}<div class="nm"><b>Your team</b><small>${t.rating.toFixed(1)} · ${esc(S.coach.name)}</small></div><span class="sc">0</span></div><div class="row" data-k="b"><span class="av" style="--g1:#e63946;--g2:#1d3557">${initials(c.boss)}</span><div class="nm"><b>${esc(c.boss)}</b><small>Daily boss · ${c.rating}</small></div><span class="sc">0</span></div><div class="dots"></div><div class="lg"></div></div></div><div id="dlyEnd"></div></div></section>`;
  let a=0,b=0;for(const g of res.games){await sleep(RM?0:420);if(RUN!==my)return;g.aWin?a++:b++;const el=$('#dly');el.querySelector('.dots').insertAdjacentHTML('beforeend',`<i class="${g.aWin?'a':'b'}"></i>`);
    el.querySelector('[data-k=a] .sc').textContent=a;el.querySelector('[data-k=b] .sc').textContent=b;el.querySelector('.lg').textContent=`Game ${a+b}: ${g.a}–${g.b}`;sfx(g.aWin?'swish':'click')}
  const D=dailyState();const official=D.last!==c.key;let xp=0;
  if(official){D.last=c.key;if(res.won){D.streak=D.won===dayKey(-1)?D.streak+1:1;D.won=c.key;D.best=Math.max(D.best,D.streak);dbScore('daily_streak',D.streak);xp=150+D.streak*10;if(D.streak>=7&&!P.ach.includes('daily7'))P.ach.push('daily7');recSet('daily',D.streak,'',`through ${c.key}`)}else{D.streak=0;xp=30}}else xp=res.won?20:5;
  gainXP(xp);SLOTS.forEach(sl=>hofAdd(S.roster[sl],{s:1,t:res.won&&official?1:0}));saveP();refreshNav();
  $('#dlyEnd').innerHTML=`<div class="result-hero"><span class="label">${official?'Official attempt':'Practice run · today’s official attempt is already in'}</span><h1 class="${res.won?'':'sad'}" style="font-size:clamp(48px,10vw,110px)">${res.won?'Boss down':'Not today'}</h1><p>${res.won?'You won':'You lost'} the series ${Math.max(res.wa,res.wb)}–${Math.min(res.wa,res.wb)}. Daily streak: <b>${D.streak}</b> (best ${D.best}). +${xp} XP.</p></div>
   <div class="actions"><button class="btn btn-go" id="dlyShare">Share card</button><button class="btn btn-ghost" onclick="startDaily()">Practice again</button><button class="btn btn-ghost" onclick="go('home')">Home</button></div>`;
  if(res.won){confetti();sfx('win')}else sfx('lose');
  $('#dlyShare').onclick=()=>openShare({kicker:`Daily challenge · ${c.key}`,title:res.won?'Boss down':'So close',sub:`${res.won?'Beat':'Fell to'} ${c.boss} ${Math.max(res.wa,res.wb)}–${Math.min(res.wa,res.wb)}`,accent:res.won?'#4fd18b':'#ff6b6b',lines:[['Daily streak',D.streak],['Best streak',D.best],...SLOTS.slice(0,5).map(sl=>[S.roster[sl].name,S.roster[sl].ovr])]})}

/* ---------- gauntlet: one opponent per decade, best of three, no second chances ---------- */
function decadeTeam(e){const pool=PLAYERS.filter(p=>p.era===e).sort((a,b)=>b.ovr-a.ovr);const ros={};const used=new Set();
  ['C','PG','PF','SG','SF'].forEach(sl=>{const p=pool.find(x=>!used.has(x.name)&&x.pos===sl)||pool.find(x=>!used.has(x.name)&&ADJ[sl].includes(x.pos))||pool.find(x=>!used.has(x.name));if(p){used.add(p.name);ros[sl]=p}});
  ['B1','B2','B3'].forEach(sl=>{const p=pool.find(x=>!used.has(x.name));if(p){used.add(p.name);ros[sl]=p}});
  return{e,ros,rating:teamCalc(ros,COACHES[0],true).rating}}
function startGauntlet(){Object.assign(S,{era:'mix',mode:'classic',diff:'pro',challenge:null,daily:null,gauntlet:true});startDraft()}
async function runGauntlet(){const t=teamCalc(S.roster,S.coach,true);const opps=ERA_ORDER.map(decadeTeam).sort((a,b)=>a.rating-b.rating).map((o,k)=>({...o,rating:o.rating-1.6+k*.45}));
  const my=RUN+1;RUN=my;
  $('#app').innerHTML=`<section class="view"><div class="wrap"><div class="draft-top"><button class="btn btn-ghost" onclick="go('home')">${icon('M19 12H5M11 18l-6-6 6-6')} Home</button><div><span class="label">The Gauntlet · best of three, no second chances</span><h2>Beat every decade</h2></div><div class="meta"><span class="tag">Your rating ${t.rating.toFixed(1)}</span><button class="btn btn-ghost" id="gSkip">Skip ahead</button></div></div>
   <div class="ladder">${opps.map((o,k)=>`<div class="rung" id="rung${k}" style="--c1:${ERAS[o.e].c1};--c2:${ERAS[o.e].c2};animation-delay:${k*50}ms"><span class="rn">${k+1}</span><div class="rinfo"><b>${ERAS[o.e].full} all-stars</b><small>${Object.values(o.ros).slice(0,3).map(p=>esc(last(p.name))).join(', ')} · rated ${o.rating.toFixed(1)}</small></div><span class="rsc" id="rsc${k}">–</span><div class="dots" id="rd${k}"></div></div>`).join('')}</div><div id="gEnd"></div></div></section>`;
  let skip=false;$('#gSkip').onclick=()=>skip=true;let won=0;
  for(let k=0;k<opps.length;k++){const o=opps[k];const el=$('#rung'+k);el.classList.add('cur');el.scrollIntoView({block:'center',behavior:skip||RM?'auto':'smooth'});
    const r=await runSeries({me:{rating:t.rating},opp:{rating:o.rating},bo:3,pace:ERAS[o.e].pace});let a=0,b=0;
    for(const g of r.games){if(!skip&&!RM)await sleep(320);if(RUN!==my)return;g.aWin?a++:b++;$('#rd'+k).insertAdjacentHTML('beforeend',`<i class="${g.aWin?'a':'b'}"></i>`);$('#rsc'+k).textContent=`${a}–${b}`}
    el.classList.remove('cur');el.classList.add(r.won?'won':'lost');sfx(r.won?'swish3':'lose');if(!r.won)break;won++;if(!skip&&!RM)await sleep(250)}
  const perfect=won===opps.length;const xp=won*40+(perfect?300:0);gainXP(xp);P.gauntlet=Math.max(P.gauntlet||0,won);dbScore('gauntlet',won);dbEvent('gauntlet',{won});recSet('gauntlet',won,'',perfect?'perfect run':`${won} of 8`);
  SLOTS.forEach(sl=>hofAdd(S.roster[sl],{s:1,t:perfect?1:0}));if(perfect&&!P.ach.includes('gauntlet')){P.ach.push('gauntlet');setTimeout(()=>{const a=ACH.find(x=>x[0]==='gauntlet');toast(a[1],a[2],a[3])},1200)}saveP();refreshNav();
  $('#gEnd').innerHTML=`<div class="result-hero"><span class="label">${won} of 8 decades beaten</span><h1 class="${perfect?'':'sad'}" style="font-size:clamp(48px,10vw,110px)">${perfect?'Untouchable':won>=5?'Deep run':'Run over'}</h1><p>+${xp} XP · best ever: ${P.gauntlet} of 8</p></div>

/* ---------- leaderboards ---------- */
async function admBoard(){const el=$('#admBd');if(!el||!DB.ok)return;const bd=ADM.bd||'daily_streak';const B=BOARDS.find(b=>b[0]===bd);
  const r=await DB.c.from('scores').select('uid,name,value,updated_at').eq('board',bd).order('value',{ascending:false}).order('updated_at',{ascending:true}).limit(50);if(!$('#admBd'))return;
  const rows=r.data||[];setHTML(el,`${admMsg()}${rows.length?`<div class="tbl-wrap"><table><tr><th>#</th><th>Player</th><th class="n">${esc(B[2])}</th><th>When</th><th></th></tr>${rows.map((x,i)=>`<tr data-k="${x.uid}"><td>${i+1}</td><td>${esc(x.name)}</td><td class="n"><b>${+x.value}</b></td><td>${ago(x.updated_at)}</td><td><button class="mini warn" data-abx="${x.uid}">Remove</button></td></tr>`).join('')}</table></div>
    <div class="actrow" style="margin-top:10px"><button class="btn btn-ghost warn" id="abReset">Reset this whole board</button></div>`:'<p class="hint">Nobody on this board yet.</p>'}`);
  $$('[data-abx]').forEach(b=>b.onclick=async()=>{const r2=await admRpc('admin_delete_score',{p_board:bd,p_uid:b.dataset.abx});if(!r2.error){ADM.msg='✓ Removed.';const tr=b.closest('tr');fadeOut(tr)}});
  const R=$('#abReset');if(R)R.onclick=async()=>{if(!R.dataset.arm){R.dataset.arm=1;R.textContent='Tap again to wipe every score';return}const r2=await admRpc('admin_reset_board',{p_board:bd});if(!r2.error)ADM.msg='✓ Board reset.';admBoard()}}

/* ---------- promo codes ---------- */
async function admCodes(){const el=$('#admPc');if(!el||!DB.ok)return;const r=await admRpc('admin_promos');if(!$('#admPc'))return;const rows=r.data||[];
  setHTML(el,rows.length?rows.map(c=>{const exp=c.expires_at&&new Date(c.expires_at)<new Date();return `<div class="offer" data-k="${esc(c.code)}"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b class="mono" style="font-size:18px;letter-spacing:.12em">${esc(c.code)}</b>${!c.active?'<span class="tag">off</span>':exp?'<span class="tag">expired</span>':'<span class="tag done">live</span>'}</div>
    <span class="hint">${[c.xp?`+${c.xp} XP`:'',c.title?`"${esc(c.title)}" title`:''].filter(Boolean).join(' · ')} · used ${c.uses}${c.max_uses?' of '+c.max_uses:''} · ${c.expires_at?(exp?'expired ':'expires ')+new Date(c.expires_at).toLocaleDateString():'never expires'}</span>
    <div class="actrow" style="margin-top:2px"><button class="mini" data-pcy="${esc(c.code)}">Copy</button><button class="mini" data-pct="${esc(c.code)}|${c.active?0:1}">${c.active?'Turn off':'Turn on'}</button><button class="mini warn" data-pcx2="${esc(c.code)}">Delete</button></div></div>`}).join(''):'<p class="hint">No codes yet.</p>');
  $$('[data-pcy]').forEach(b=>b.onclick=async()=>{try{await navigator.clipboard.writeText(b.dataset.pcy);b.textContent='Copied'}catch(e){}});
  $$('[data-pct]').forEach(b=>b.onclick=async()=>{const[c,a]=b.dataset.pct.split('|');await admRpc('admin_toggle_promo',{p_code:c,p_active:a==='1'});admCodes()});
  $$('[data-pcx2]').forEach(b=>b.onclick=async()=>{if(!b.dataset.arm){b.dataset.arm=1;b.textContent='Sure?';return}await admRpc('admin_delete_promo',{p_code:b.dataset.pcx2});fadeOut(b.closest('.offer'))})}

const tix=()=>P.tix||0;
function addTix(n,why){P.tix=Math.max(0,(P.tix||0)+Math.round(n));if(why)toastLite(`+${Math.round(n)} 🎟 ${why}`)}
const tixHTML=()=>`<span class="tixc">🎟 <b>${tix().toLocaleString()}</b></span>`;

/* ---------- drawing a profile from any save (mine, or another player's in the admin panel) ---------- */
function jerseySVG(n){return `<svg class="avj" viewBox="0 0 40 40"><path d="M12 5h5c0 3 1.3 5 3 5s3-2 3-5h5l1.2 7c2 1 2.8 3 2.8 5V37H8V17c0-2 .8-4 2.8-5z" fill="rgba(0,0,0,.22)" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><text x="20" y="30" text-anchor="middle" font-size="13" font-weight="900" fill="currentColor">${+n||0}</text></svg>`}
function avatarHTML(d,cls=''){d=d||{};const c=d.cos||{};const g=GRADS[d.grad]||GRADS[0];let inner='';
  if(c.mode==='emb'&&EMB[c.emb])inner=`<svg class="ave" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${EMB[c.emb]}"/></svg>`;
  else if(c.mode==='jersey')inner=jerseySVG(d.num);
  else if(c.mode==='legend'&&c.legend){const p=PLAYERS.find(x=>x.id===c.legend);if(p)inner=portrait(p,'avport')}
  if(!inner)inner=esc(d.signed&&d.name?initials(d.name):'G');
  return `<span class="av ${cls} ${c.frm?'fr-'+c.frm:''} ${c.bg?'bgp-'+c.bg:''} ${c.mode==='legend'&&c.legend?'avleg':''}" style="--g1:${g[0]};--g2:${g[1]}">${inner}</span>`}
const nameCls=d=>{const c=(d||{}).cos||{};return c.nfx?'nfx nfx-'+c.nfx:''};
const flairHTML=d=>{const c=(d||{}).cos||{};return c.fl?`<span class="flair">${c.fl}</span>`:''};
const banCls=d=>{const c=(d||{}).cos||{};return c.ban?'ban ban-'+c.ban:''};

/* tickets: a daily check-in with a streak bonus */
function tixDaily(){if(P.tixDay===dayKey())return;const st=P.tixDay===dayKey(-1)?Math.min((P.tixStreak||0)+1,10):1;const n=50+st*10;P.tixDay=dayKey();P.tixStreak=st;P.tix=(P.tix||0)+n;saveP();
  setTimeout(()=>toast('Daily check-in',`+${n} tickets 🎟${st>1?` · ${st}-day streak`:''}. Spend them in the Locker.`,'M3 9a3 3 0 0 0 0 6v3h18v-3a3 3 0 0 0 0-6V6H3zM13 6v12'),900)}
/* earned items unlock themselves */
function lockerAuto(){const got=[];ITEMS.forEach(i=>{if(i.x&&!owns(i.id)&&i.x[1]()){OWN().push(i.id);got.push(i)}});
  if(got.length){saveP();got.forEach((i,k)=>setTimeout(()=>toast('Locker item unlocked',`${i.n} (${RAR[i.r][0]}): ${i.x[0]}`,'M5 12l5 5L20 7'),600+k*900))}return got}
/* the shop: six items a day, one on sale */
function shopToday(){const r=mulberry32(strHash(dayKey()+'shop'));const pool=ITEMS.filter(i=>!i.x&&itemLive(i)&&!owns(i.id));const out=[];
  const lim=pool.filter(i=>i.lim);lim.slice(0,2).forEach(i=>out.push(i));
  const rest=pool.filter(i=>!i.lim);while(out.length<6&&rest.length){out.push(rest.splice(Math.floor(r()*rest.length),1)[0])}
  const deal=out.length?out[Math.floor(r()*out.length)].id:null;return{items:out,deal}}
const dealPrice=i=>Math.round(price(i)*.6/10)*10;
function buyItem(id,cost){const i=ITEM[id];if(!i||owns(id))return false;if(tix()<cost){sfx('lose');toastLite('Not enough tickets 🎟');return false}
  P.tix-=cost;OWN().push(id);saveP();sfx('chime');vib(25);return true}
function equip(id){const i=ITEM[id];const c=COS();if(!i)return;if(!P.ach.includes('fresh')){P.ach.push('fresh');setTimeout(()=>toast('Fresh Fit','Equip something from the Locker','M5 12l5 5L20 7'),500)}
  if(i.cat==='emb'){c.mode='emb';c.emb=i.v}else c[i.cat]=c[i.cat]===i.v?'':i.v;saveP();refreshNav();sfx('click')}
function equipped(i){const c=COS();return i.cat==='emb'?c.mode==='emb'&&c.emb===i.v:c[i.cat]===i.v}
/* a preview avatar wearing one extra item */
function previewWith(i){const d=JSON.parse(JSON.stringify({name:P.name,signed:P.signed,grad:P.grad,num:P.num,cos:COS()}));if(!d.signed){d.signed=true;d.name=d.name||'You'}
  if(i.cat==='emb'){d.cos.mode='emb';d.cos.emb=i.v}else d.cos[i.cat]=i.v;return d}
function itemSwatch(i){const d=previewWith(i);
  if(i.cat==='nfx')return `<span class="swn ${nameCls(d)}">${esc((P.signed&&P.name)||'Name')}</span>`;
  if(i.cat==='fl')return `<span class="swfl">${i.v}</span>`;
  if(i.cat==='ban')return `<span class="swban ban ban-${i.v}">${avatarHTML(d,'mid')}</span>`;
  return avatarHTML(d,'mid')}

/* ---------- the Locker screen ---------- */
let LK2={tab:'shop',arm:null};
function openLocker(tab){if(tab)LK2.tab=tab;lockerAuto();const c=COS();const d={name:P.name,signed:P.signed,grad:P.grad,num:P.num,cos:c};const li=levelInfo(P.xp);
  const head=`<div class="lkhead ${banCls(d)}">${avatarHTML(d,'big')}<div class="lkname"><span class="label">${esc(P.title||rankName(li.lvl))} · Level ${li.lvl}</span><h2><span class="${nameCls(d)}">${esc(P.signed?P.name:'Guest')}</span>${flairHTML(d)}</h2>${tixHTML()}</div></div>`;
  const tabs=`<nav class="lg-tabs lktabs">${CATS.map(([k,n])=>`<button data-lkt="${k}" class="${LK2.tab===k?'on':''}">${n}</button>`).join('')}</nav>`;
  let body='';
  const tile=(i,cost,tag)=>{const own=owns(i.id),eq=own&&equipped(i),lockX=i.x&&!own;const R=RAR[i.r];
    return `<div class="lkit ${eq?'eq':''} ${own?'own':''}" data-k="${i.id}" style="--rc:${R[1]}"><div class="lksw">${itemSwatch(i)}</div><b>${esc(i.n)}</b><small style="color:${R[1]}">${R[0]}${i.lim?' · Limited':''}${tag?' · '+tag:''}</small>
      ${eq?`<button class="mini" data-lke="${i.id}">Equipped ✓</button>`:own?`<button class="mini go" data-lke="${i.id}">Equip</button>`:lockX?`<span class="lklock">🔒 ${esc(i.x[0])}</span>`:`<button class="mini ${tix()>=cost?'buy':''}" data-lkb="${i.id}" data-cost="${cost}">${LK2.arm===i.id?'Tap to confirm':'🎟 '+cost.toLocaleString()}</button>`}</div>`};
  if(LK2.tab==='shop'){const s=shopToday();const left=new Date();left.setHours(24,0,0,0);
    body=`<div class="lkshop"><div class="packcard"><div class="pack"><span>?</span></div><div><span class="label">Mystery pack</span><h3>Random cosmetic</h3><p class="hint">60% Common · 28% Rare · 10% Epic · 2% Legendary. Duplicates refund half.</p><button class="btn btn-go" id="lkPack">Open for 🎟 300</button></div></div>
      <div><span class="label">Today's shop · new items in ${Math.max(1,Math.round((left-Date.now())/36e5))}h</span><div class="lkgrid">${s.items.map(i=>tile(i,s.deal===i.id?dealPrice(i):price(i),s.deal===i.id?'40% off':'')).join('')||'<p class="hint">You own everything in today\'s shop. Wow.</p>'}</div></div>
      <div class="card lkearn"><span class="label">How to earn tickets</span><p class="hint">Every game you play earns tickets (about 1 for every 8 XP). Daily check-in gives 60–150. Each level up gives 100. The developer sometimes drops codes too.</p></div></div>`}
  else if(LK2.tab==='avatar'){const cards=[...new Set(P.cards||[])].map(id=>PLAYERS.find(p=>p.id===id)).filter(Boolean).sort((a,b)=>b.ovr-a.ovr).slice(0,40);
    body=`<div class="setrow"><span class="label">Avatar shows</span>${lgChips('data-lkm',[['init','Initials'],['jersey','My jersey #'+(P.num||0)],['emb','Emblem'],['legend','Legend card']],c.mode||'init',0,1)}</div>
      ${c.mode==='legend'||LK2.sub==='legend'?`<p class="hint">Use any player card you own. You get cards by drafting players.</p><div class="lkcards">${cards.map(p=>`<button class="lkcard ${c.legend===p.id?'on':''}" data-lkl="${p.id}" title="${esc(p.name)}">${portrait(p,'sm')}<small>${esc(last(p.name))}</small></button>`).join('')||'<p class="hint">Draft some players first.</p>'}</div>`:''}
      <span class="label" style="margin-top:12px;display:block">Emblems</span><div class="lkgrid">${ITEMS.filter(i=>i.cat==='emb'&&(itemLive(i)||owns(i.id))).map(i=>tile(i,price(i))).join('')}</div>
      <span class="label" style="margin-top:12px;display:block">Colors</span><div class="swatches lkcol">${GRADS.map((g,k)=>k<BASE_GRADS||unlocks().grad.includes(k)?`<button data-lkg="${k}" class="${k===P.grad?'on':''}" style="background:linear-gradient(135deg,${g[0]},${g[1]})"></button>`:'').join('')}</div><p class="hint">More colors come from the season pass.</p>`}
  else{body=`<div class="lkgrid">${ITEMS.filter(i=>i.cat===LK2.tab&&(itemLive(i)||owns(i.id))).map(i=>tile(i,price(i))).join('')}</div>${c[LK2.tab]?`<div class="actrow"><button class="btn btn-ghost" data-lkoff="${LK2.tab}">Take it off</button></div>`:''}`}
  lgOpenModal(`<span class="label">Customize your profile</span><h2 class="mtitle">The Locker</h2>${head}${tabs}<div class="lkbody">${body}</div>`,true);
  const re=()=>openLocker();
  $$('[data-lkt]').forEach(b=>b.onclick=()=>{LK2.tab=b.dataset.lkt;LK2.arm=null;re()});
  $$('[data-lke]').forEach(b=>b.onclick=()=>{equip(b.dataset.lke);re()});

/* ---------- Buzzer Beater: a timing game. Stop the meter in the green, the zone shrinks as you get hot ---------- */
function mgSC(){const my=++RUN;let made=0,shots=0,streak=0,left=30,pos=0,dir=1,speed=.9,zone=.2,center=.5,busy=false,raf=0,last=performance.now();
  mgFrame('Buzzer Beater · 30 seconds',`<div class="bzb"><div class="scboard"><div><small>Made</small><b id="scM">0</b></div><div><small>Clock</small><b id="scT" class="clock">30</b></div><div><small>Streak</small><b id="scS">0</b></div></div>
    <div class="sccourt" id="scC"><svg class="schoop" viewBox="0 0 120 80"><rect x="35" y="4" width="50" height="32" rx="3" class="bb"/><rect x="50" y="18" width="20" height="13" class="bbs"/><ellipse cx="60" cy="40" rx="15" ry="3.4" class="rim"/><path d="M46 41l4 18M74 41l-4 18M52 41l2 18M68 41l-2 18M60 41v18M47 48h26M49 54h22" class="net"/></svg><span class="scball" id="scB"></span><span class="scmsg" id="scMsg"></span></div>
    <div class="scmeter"><i class="sczone" id="scZ"></i><i class="scmark" id="scK"></i></div>
    <div class="actrow" style="justify-content:center"><button class="btn btn-go btn-big" id="scGo">${icon('M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM2 12h20M12 2v20',18)} Shoot</button></div><p class="hint" style="text-align:center">Tap Shoot, press Space, or tap the court when the marker is in the green. Every make in a row shrinks the green and speeds things up.</p></div>`);
  const Z=$('#scZ'),K=$('#scK');const place=()=>{Z.style.left=(center-zone/2)*100+'%';Z.style.width=zone*100+'%'};place();
  const loop=t=>{if(RUN!==my)return;const dt=Math.min(50,t-last)/1000;last=t;if(!busy){pos+=dir*speed*dt;if(pos>1){pos=1;dir=-1}if(pos<0){pos=0;dir=1}K.style.left=pos*100+'%'}raf=requestAnimationFrame(loop)};raf=requestAnimationFrame(loop);
  const timer=setInterval(()=>{if(RUN!==my){clearInterval(timer);return}left--;const t=$('#scT');if(t){t.textContent=left;t.classList.toggle('low',left<=5)}if(left<=0){clearInterval(timer);end()}},1000);
  const shoot=()=>{if(busy||left<=0||RUN!==my)return;busy=true;shots++;const off=Math.abs(pos-center);const ok=off<=zone/2,close=!ok&&off<=zone/2+.07;
    const B=$('#scB'),msg=$('#scMsg');B.className='scball '+(ok?'make':close?'rim':'miss');void B.offsetWidth;
    if(ok){made++;streak++;sfx('swish');vib(15);zone=Math.max(.06,zone*.86);speed=Math.min(2.6,speed*1.09);msg.textContent=streak>=3?`🔥 ${streak} straight`:off<zone/5?'Perfect!':'Swish';
      if(streak>=5&&streak%5===0){left+=2;msg.textContent=`🔥 ${streak} straight · +2s`}}
    else{streak=0;sfx('lose');vib(60);zone=Math.min(.2,zone*1.15);speed=Math.max(.9,speed*.92);msg.textContent=close?'Off the rim':'Brick'}
    msg.className='scmsg show '+(ok?'ok':'no');$('#scM').textContent=made;$('#scS').textContent=streak;
    setTimeout(()=>{if(RUN!==my)return;busy=false;center=.2+Math.random()*.6;place();msg.className='scmsg'},560)};
  $('#scGo').onclick=shoot;$('#scC').onclick=shoot;const key=e=>{if(RUN!==my){removeEventListener('keydown',key);return}if(e.code==='Space'){e.preventDefault();shoot()}};addEventListener('keydown',key);
  const end=()=>{cancelAnimationFrame(raf);removeEventListener('keydown',key);if(RUN!==my)return;const pct=shots?Math.round(made/shots*100):0;const xp=made*8+(pct>=70&&made>=8?40:0);
    if(made>=15&&!P.ach.includes('sniper')){P.ach.push('sniper');setTimeout(()=>toast('Sniper','Make 15 in Buzzer Beater','M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12z'),800)}
    mgFrame('Buzzer Beater',`<div class="result-hero"><h1 class="${made>=10?'':'sad'}" style="font-size:72px">${made} made</h1><p>${shots} shots · ${pct}% from the field</p>${mgDone('sc',made,'',xp,'shot')}</div><div class="actions"><button class="btn btn-go" onclick="mgSC()">Shoot again</button><button class="btn btn-ghost" onclick="openBoards('shot')">Leaderboard</button></div>`);if(made>=10)sfx('win')}}

    const clues=[`Starred in the ${vs.map(v=>ERAS[v.era].full).join(' and ')}`,`Played ${({PG:'point guard',SG:'shooting guard',SF:'small forward',PF:'power forward',C:'center'})[p.pos]||p.pos}`,
      tr.length?`Known as: ${tr.join(', ')}`:`Rated ${p.ovr} overall in Hall Pass`,`Career: ${st[0]} points, ${st[1]} rebounds, ${st[2]} assists per game`,`Last name starts with "${sur[0]}" and has ${sur.replace(/[^A-Za-z]/g,'').length} letters`];

    const draw=()=>{mgFrame(`Who am I? · ${round+1} of 5 · score ${score}`,`<div class="wa"><div class="waclues">${clues.map((c,k)=>`<div class="waclue ${k<shown?'on':''}" data-k="c${k}"><span>${k+1}</span>${k<shown?esc(c):'<i>locked</i>'}</div>`).join('')}</div>

/* ---------- Rank 'Em: tap four players in order, highest first ---------- */
function mgRK(){const my=++RUN;let round=0,score=0;const names=shuffle(realNames().filter(n=>playerByName(n)));
  const step=()=>{if(RUN!==my)return;if(round>=5)return done();const si=round%3;const four=[];for(const n of names.slice(round*6)){if(four.length===4)break;if(four.every(f=>Math.abs(CAREER[f][si]-CAREER[n][si])>=.6))four.push(n)}for(const n of names){if(four.length===4)break;if(!four.includes(n)&&four.every(f=>CAREER[f][si]!==CAREER[n][si]))four.push(n)}
    const truth=[...four].sort((a,b)=>CAREER[b][si]-CAREER[a][si]);const pick=[];
    const draw=()=>{mgFrame(`Rank 'em · ${round+1} of 5 · score ${score}`,`<p class="mutep" style="margin:6px 0 12px">Tap them from <b>most</b> to <b>fewest</b> career <b style="color:var(--amber)">${STATN[si]} per game</b>.</p>
      <div class="rkg">${four.map(n=>{const k=pick.indexOf(n);return `<button class="rkp ${k>=0?'on':''}" data-rk="${esc(n)}" ${k>=0?'disabled':''}>${k>=0?`<em>${k+1}</em>`:''}${portrait(playerByName(n),'big')}<b>${esc(n)}</b><small>${ERAS[playerByName(n).era].full} · ${playerByName(n).pos}</small><span class="rkv" hidden>${CAREER[n][si]}</span></button>`}).join('')}</div>
      ${pick.length&&pick.length<4?'<div class="actrow" style="justify-content:center"><button class="btn btn-ghost" id="rkU">Undo</button></div>':''}`);
      $$('[data-rk]').forEach(b=>b.onclick=()=>{pick.push(b.dataset.rk);sfx('click');if(pick.length===3)pick.push(four.find(f=>!pick.includes(f)));if(pick.length===4)reveal();else draw()});
      const u=$('#rkU');if(u)u.onclick=()=>{pick.pop();draw()}};
    const reveal=()=>{draw();let pts=0;pick.forEach((n,k)=>{if(truth[k]===n)pts++});const bonus=pts===4?2:0;score+=pts+bonus;
      $$('[data-rk]').forEach(b=>{const n=b.dataset.rk;const k=pick.indexOf(n);b.classList.add(truth[k]===n?'right':'wrong');const v=b.querySelector('.rkv');v.hidden=false;v.textContent=CAREER[n][si]+(truth[k]===n?' ✓':` · #${truth.indexOf(n)+1}`)});
      sfx(pts===4?'win':pts>=2?'swish':'lose');toastLite(pts===4?'Perfect order! +6':`${pts} of 4 in the right spot`);setTimeout(()=>{round++;step()},2200)};
    draw()};
  const done=()=>{const xp=score*4;mgFrame("Rank 'em",`<div class="result-hero"><h1 class="${score>=18?'':'sad'}" style="font-size:72px">${score}/30</h1>${mgDone('rk',score,'/30',xp,'rank')}</div><div class="actions"><button class="btn btn-go" onclick="mgRK()">Play again</button><button class="btn btn-ghost" onclick="openBoards('rank')">Leaderboard</button></div>`);if(score>=18)sfx('win')};
  step()}

/* ======================= USERNAMES: required, 3-25 characters, real letters, kept friendly (the database checks the same rules) ======================= */
const NAME_BAD=['fuck', 'fuk', 'fck', 'shit', 'bitch', 'biatch', 'cunt', 'nigger', 'nigga', 'faggot', 'retard', 'whore', 'slut', 'pussy', 'penis', 'vagina', 'porn', 'hitler', 'kkk', 'chink', 'kike', 'tranny', 'twat', 'jizz', 'bastard', 'asshole', 'arsehole', 'motherf', 'blowjob', 'handjob', 'dildo', 'hentai', 'molest', 'pedophil', 'paedo', 'wetback', 'beaner', 'raghead', 'towelhead', 'killyourself', 'cocksuck', 'dickhead', 'dickface', 'dumbass', 'jackass', 'bollock', 'cumshot', 'orgasm', 'erection', 'horny', 'nude', 'naked', 'sexy', 'xxx', 'incest', 'genital', 'testicle', 'scrotum', 'semen', 'sperm', 'queef', 'fellat', 'cunnil', 'skank', 'boner', 'bigdick', 'dicks'],NAME_BAD_W=['ass', 'arse', 'dick', 'cock', 'cum', 'sex', 'tit', 'tits', 'boob', 'boobs', 'anal', 'rape', 'raped', 'rapist', 'spic', 'dyke', 'coon', 'fag', 'fags', 'pedo', 'damn', 'hell', 'crap', 'piss', 'prick', 'butt', 'butthole', 'ho', 'hoe', 'hoes', 'thot', 'negro', 'heil', 'nazi', 'nazis', 'kys', 'wank', 'wanker', 'spunk', 'gook', 'meth', 'weed', 'suicide', 'isis', 'terrorist', 'nsfw', 'milf', 'dilf', 'bj', 'wtf', 'stfu', 'fu', 'gtfo'],NAME_RES_SUB=['admin', 'moderator', 'developer', 'official', 'hallpass', 'support', 'system', 'staff'],NAME_RES_W=['mod', 'dev', 'owner', 'claude', 'anthropic'];
const LEET={'0':'o','1':'i','3':'e','4':'a','5':'s','7':'t','8':'b','9':'g'};
const nameClean=raw=>String(raw||'').trim().replace(/\s+/g,' ');
const col1=w=>w.replace(/(.)\1+/g,'$1');
function nameProblem(raw){const n=nameClean(raw);
  if(!n)return'Pick a username.';
  if(n.length<3)return'Use at least 3 characters.';
  if(n.length>25)return'Keep it to 25 characters or fewer.';
  if(!/^[A-Za-z0-9 ._'-]+$/.test(n))return"Use letters, numbers, spaces and . _ - ' only.";
  const letters=(n.match(/[A-Za-z]/g)||[]).length,digits=(n.match(/[0-9]/g)||[]).length;
  if(letters<3)return'Use at least 3 letters. Not just numbers or symbols.';
  if(digits>letters)return'Use more letters than numbers.';
  if(/^[ ._'-]|[ ._'-]$/.test(n))return'Start and end with a letter or number.';
  if(/[._'-]{2}|[._'-] [._'-]| [._'-]/.test(n))return'No symbols next to each other.';
  if(/(.)\1{3}/i.test(n))return'Too many of the same character in a row.';
  const l=n.toLowerCase().replace(/[0-9]/g,c=>LEET[c]||c);const sq=l.replace(/[^a-z]/g,''),sq1=col1(sq);
  const toks=l.split(/[^a-z]+/).filter(Boolean);const c2=t=>t.replace(/(.)\1{2,}/g,'$1$1');
  if(NAME_BAD.some(w=>sq.includes(w)||(col1(w).length>=4&&sq1.includes(col1(w))))||toks.some(t=>NAME_BAD_W.includes(t)||NAME_BAD_W.includes(c2(t))))return"That name isn't allowed. Keep it friendly.";
  if(NAME_RES_SUB.some(w=>sq.includes(w))||toks.some(t=>NAME_RES_W.includes(t)))return'That name is reserved. Try another.';
  return''}

  ['deadeye','Deadeye','Made threes','tpm',[12,50,130,280],['three']],
  ['poster','Posterizer','Dunks','dnk',[8,35,90,200],['dunk']],
  ['ankle','Ankle Breaker','Drives finished at the rim','drv',[10,45,110,240],['drive']],
  ['dimer','Dimer','Assists','ast',[25,110,280,600],['pass']],
  ['clamps','Clamps','Defensive stops','stp',[10,45,110,240],['guard']],
  ['pick','Pickpocket','Steals','stl',[8,35,90,200],['steal']],
  ['wall','Rim Protector','Blocks','blk',[8,35,90,200],['block']],

  ['clutch','Clutch Gene','Clutch shots made','clu',[2,8,20,45],['clutch']],
  ['bucket','Bucket Getter','Points','pts',[150,700,1800,4000],['three','drive','dunk','mid','post']],
  ['iron','Iron Man','Games played','gp',[15,60,150,320],['energy']]];
const CR_TIERS=[['Bronze','#d08a4a',.03],['Silver','#c9d2e3',.06],['Gold','#ffcc4d',.1],['Hall of Fame','#b97bff',.15]];
const CR_PERKS=[['gym','Gym rat','Start every new career with +3 to every attribute',30],['scout','Scouts love you','Bigger green windows in the combine and on clutch shots',20],
  ['leader','Born leader','Start with +15 coach trust',20],['learner','Fast learner','Earn 25% more skill points',40],['badge','Head start','Start with Bronze in your play style\'s main badge',35],['vet','Built to last','Your athleticism starts declining a year later',30]];
const CR_FIRST=['Jalen','Marcus','Tre','Dante','Isaiah','Malik','Cam','Devin','Andre','Xavier','Darius','Elijah','Quentin','Rashad','Terrence','Victor','Jordan','Kendall','Bryce','Nico','Amari','Desmond','Tyrese','Omari','Mateo','Kai','Luka','Theo','Silas','Ezra'];
const CR_LAST=['Hayes','Brooks','Whitfield','Mosley','Pruitt','Langford','Ellison','Vance','Okoye','Sutton','Calloway','Brennan','Holloway','Mercer','Draper','Kingsley','Abernathy','Fairley','Rowe','Whitlock','Dunmore','Castellano','Ferro','Achebe','Lindqvist','Moreau','Tanaka','Adeyemi','Novak','Quarles'];
const LEG=()=>{if(!P.legacy)P.legacy={pts:0,perks:[],careers:[]};return P.legacy};
const hasPerk=k=>LEG().perks.includes(k);
const CAR=()=>P.car||null;
const crRnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const crPick=a=>a[Math.floor(Math.random()*a.length)];
const crFake=()=>crPick(CR_FIRST)+' '+crPick(CR_LAST);
function crOvr(c){const w=CR_W[c.pos];let s=0;for(const k in w)s+=c.at[k]*w[k];return Math.max(40,Math.min(99,Math.round(s*1.08-3)))}
function crTier(c,b){const v=(c.bd&&c.bd[b[3]])||0;let t=-1;b[4].forEach((th,i)=>{if(v>=th)t=i});return t}
function crBonus(c,tag){let s=0;CR_BADGES.forEach(b=>{if(b[5].includes(tag)){const t=crTier(c,b);if(t>=0)s+=CR_TIERS[t][2]}});return s}
const crRole=c=>c.trust>=75&&crOvr(c)>=70?'star':c.trust>=55?'starter':c.trust>=35?'sixth':'bench';
const CR_ROLE={bench:['Bench','14 min'],sixth:['Sixth man','22 min'],starter:['Starter','32 min'],star:['Franchise star','36 min']};
const crMin=c=>({bench:14,sixth:22,starter:32,star:36})[crRole(c)];
const crAttrCost=v=>Math.max(2,Math.ceil((v-38)/5));
const crSeasonLen=20;

/* ---------- league: eight teams of legends, you're on one of them ---------- */
function crLegends(q,n,used,needPos){const pool=PLAYERS.filter(p=>!used.has(p.name));const out=[];
  const pick=(f)=>{const cand=pool.filter(p=>!used.has(p.name)&&f(p)).sort((a,b)=>Math.abs(a.ovr-q)-Math.abs(b.ovr-q)+(Math.random()-.5)*6);const p=cand[0];if(p){used.add(p.name);out.push(p.id)}return p};
  ['PG','SG','SF','PF','C'].forEach(pos=>{if(pos!==needPos)pick(p=>p.pos===pos)});
  if(needPos)pick(p=>p.pos===needPos);
  while(out.length<n)if(!pick(()=>true))break;return out}
function crTeamRating(c,t){const ps=t.roster.map(id=>PLAYERS.find(p=>p.id===id)).filter(Boolean).sort((a,b)=>b.ovr-a.ovr).slice(0,8);
  let r=ps.reduce((s,p)=>s+p.ovr,0)/Math.max(1,ps.length);if(t.me)r+=(crOvr(c)-76)*.06*(crMin(c)/32);return r}
function crBuildLeague(c,myQ,keepMine){const used=new Set();const names=shuffle(TEAMS).slice(0,8);const teams=[];
  const mine=keepMine?{...keepMine,w:0,l:0}:null;if(mine)mine.roster.forEach(id=>{const p=PLAYERS.find(x=>x.id===id);if(p)used.add(p.name)});
  for(let i=0;i<8;i++){if(i===0&&mine){teams.push(mine);continue}const q=i===0?myQ:i<=2?87+Math.random()*4:80+Math.random()*9;
    teams.push({id:'t'+i+rid().slice(0,4),name:i===0?(keepMine?keepMine.name:names[0]):names[i],q,roster:crLegends(q,9,used,i===0?c.pos:null),w:0,l:0,me:i===0})}
  teams.forEach(t=>t.me=false);teams[0].me=true;
  /* the vet who starts at your position until you earn it */
  const vet=teams[0].roster.map(id=>PLAYERS.find(p=>p.id===id)).find(p=>p&&p.pos===c.pos);c.vet=vet?vet.name:'the veteran';
  const r=c.rival;if(r){r.team=1+Math.floor(Math.random()*7)}
  const order=[1,2,3,4,5,6,7];const sched=[];for(let g=0;g<crSeasonLen;g++)sched.push({opp:order[g%7],home:g%2===0});
  c.league={teams,my:0,sched:shuffle(sched)};c.gi=0;c.ss={gp:0,min:0,pts:0,reb:0,ast:0,stl:0,blk:0,fgm:0,fga:0,tpm:0,tpa:0,to:0,w:0,l:0,sixth:0};c.po=null;c.asDone=false;c.trained=false}
function crSimOthers(c){const L=c.league;const others=L.teams.map((_,i)=>i).filter(i=>i!==L.my&&i!==L.sched[c.gi-1].opp);const sh=shuffle(others);
  for(let k=0;k+1<sh.length;k+=2){const a=L.teams[sh[k]],b=L.teams[sh[k+1]];const g=playGame(crTeamRating(c,a),crTeamRating(c,b),104);if(g.aWin){a.w++;b.l++}else{b.w++;a.l++}}
  const rv=c.rival;if(rv){rv.ovr=Math.min(97,rv.ovr+(Math.random()<.18?1:0));rv.gp++;rv.pts+=Math.max(2,Math.round((rv.ovr-52)*.55+gauss()*5))}}
const crStandings=c=>c.league.teams.map((t,i)=>({...t,i})).sort((a,b)=>(b.w-a.w)||(b.q-a.q));

/* ---------- create a player ---------- */
let CRN={pos:'SG',arch:'sniper',ht:1,num:23,name:''};
function crDraftAttrs(){const a={...CR_ARCH[CRN.arch].a};const m=CR_HTMOD[CRN.ht];for(const k in m)a[k]+=m[k];if(hasPerk('gym'))for(const k in a)a[k]+=3;return a}
function crCreateScreen(){go('home');RUN++;if(!CRN.name&&P.signed)CRN.name=P.name;const archs=Object.entries(CR_ARCH).filter(([,a])=>a.pos.includes(CRN.pos));if(!CR_ARCH[CRN.arch].pos.includes(CRN.pos))CRN.arch=archs[0][0];
  const at=crDraftAttrs();const fake={pos:CRN.pos,at};const ov=crOvr(fake);const L=LEG();
  $('#app').innerHTML=`<section class="view"><div class="wrap"><div class="draft-top"><button class="btn btn-ghost" onclick="go('home')">${icon('M19 12H5M11 18l-6-6 6-6')} Home</button><div><span class="label">The Rise · career mode</span><h2>Create your player</h2></div></div>
    <div class="crc"><div class="card crform">
      <div class="field"><label class="label" for="crN">Player name</label><input id="crN" maxlength="25" value="${esc(CRN.name)}" placeholder="e.g. Jay Hoops"><p class="hint" id="crNh">This is the name the crowd chants.</p></div>
      <div class="setrow"><span class="label">Position</span>${lgChips('data-crp',Object.keys(CR_POS).map(k=>[k,k]),CRN.pos)}</div>
      <span class="label">Play style</span><div class="crarch">${archs.map(([k,a])=>`<button class="crar ${CRN.arch===k?'on':''}" data-cra="${k}"><b>${a.n}</b><small>${a.d}</small></button>`).join('')}</div>
      <div class="setrow"><span class="label">Height</span>${lgChips('data-crh',CR_HT[CRN.pos].map((h,i)=>[i,h+(i===0?' · quicker':i===2?' · stronger':'')]),CRN.ht)}</div>
      <div class="field"><label class="label" for="crJ">Jersey number</label><input id="crJ" type="number" min="0" max="99" value="${CRN.num}"></div>
      ${L.perks.length?`<p class="hint">Legacy perks active: ${L.perks.map(k=>(CR_PERKS.find(p=>p[0]===k)||[0,k])[1]).join(', ')}</p>`:''}
      <button class="btn btn-go btn-big" id="crGo" style="width:100%;margin-top:10px">Head to the draft combine ${icon('M5 12h14M13 6l6 6-6 6',18)}</button></div>
    <div class="card crprev"><div class="crcard">${avatarHTML({...P,signed:true,name:CRN.name||'You',num:CRN.num},'big')}<div><span class="label">${CR_POS[CRN.pos]} · ${CR_HT[CRN.pos][CRN.ht]} · #${CRN.num}</span><h3>${esc(CRN.name||'Your player')}</h3><span class="crarchtag">${CR_ARCH[CRN.arch].n}</span></div><div class="crovr"><b>${ov}</b><small>OVR</small></div></div>
      ${crAttrBars(at)}<p class="hint">Your Locker look (emblem, frame, colors) is your player's look. Everyone starts around 60 overall. Legends are made, not born.</p></div></div></div></section>`;
  const re=()=>{CRN.name=$('#crN').value;CRN.num=Math.max(0,Math.min(99,+$('#crJ').value||0));crCreateScreen()};
  $$('[data-crp]').forEach(b=>b.onclick=()=>{CRN.pos=b.dataset.v;CRN.name=$('#crN').value;crCreateScreen()});
  $$('[data-cra]').forEach(b=>b.onclick=()=>{CRN.arch=b.dataset.cra;re()});$$('[data-crh]').forEach(b=>b.onclick=()=>{CRN.ht=+b.dataset.v;re()});
  $('#crJ').onchange=re;$('#crN').oninput=()=>{const bad=nameProblem($('#crN').value);const h=$('#crNh');h.textContent=bad?'✗ '+bad:'✓ Looks good';h.className='hint '+(bad?'errc':'okc')};
  $('#crGo').onclick=()=>{const n=nameClean($('#crN').value);const bad=nameProblem(n);if(bad){const h=$('#crNh');h.textContent='✗ '+bad;h.className='hint errc';sfx('lose');return}
    CRN.name=n;CRN.num=Math.max(0,Math.min(99,+$('#crJ').value||0));
    const c={v:1,id:rid(),name:n,num:CRN.num,pos:CRN.pos,arch:CRN.arch,ht:CRN.ht,age:19,season:1,stage:'combine',at:crDraftAttrs(),ax:{},sp:0,bd:{},trust:30+(hasPerk('leader')?15:0),
      awards:[],seasons:[],news:[],log:[],rings:0,teamName:'',created:Date.now(),ovr0:0,
      rival:{name:crFake(),ovr:0,pts:0,gp:0,team:1}};
    if(hasPerk('badge')){const b=CR_BADGES.find(x=>x[0]===CR_ARCH[c.arch].b);if(b)c.bd[b[3]]=b[4][0]}
    c.ovr0=crOvr(c);c.rival.ovr=c.ovr0+crRnd(-2,3);P.car=c;saveP();dbEvent('career',{k:'start',pos:c.pos,arch:c.arch});sfx('chime');crCombine()}}
function crAttrBars(at,c){return `<div class="crbars">${CR_ATTR.map(([k,n])=>{const v=Math.round(at[k]);const x=c&&c.ax?c.ax[k]||0:0;return `<div class="crbar"><span>${n}</span><i><s style="width:${v}%"></s>${x?`<u style="width:${x}%"></u>`:''}</i><b>${v}</b>${c&&c.stage!=='retired'?`<button class="crup" data-crup="${k}" ${c.sp>=crAttrCost(v)&&v<99?'':'disabled'} title="Costs ${crAttrCost(v)} skill points">+<small>${crAttrCost(v)}</small></button>`:''}</div>`}).join('')}</div>`}

/* ---------- the combine: three drills decide where you get drafted ---------- */
async function crCombine(){const c=CAR();go('home');RUN++;const my=RUN;const res=[];
  const drills=[['Shooting','Stop the meter in the green. Five shots.',{reps:5,zone:.16+(c.at.sht-50)/400,speed:1.0}],['Agility','Faster meter, smaller window.',{reps:5,zone:.12+(c.at.ath-50)/400,speed:1.45}],['Vertical leap','One huge jump: hit the sweet spot.',{reps:3,zone:.1+(c.at.ath-50)/500,speed:1.8}]];
  for(let i=0;i<drills.length;i++){if(RUN!==my)return;const [n,d,o]=drills[i];
    $('#app').innerHTML=`<section class="view"><div class="wrap"><div class="draft-top"><div><span class="label">Draft combine · drill ${i+1} of 3</span><h2>${n}</h2></div></div><div class="card crdrill"><p class="mutep">${d} Scouts from every team are watching.</p><div id="crMet"></div></div></div></section>`;
    const r=await crMeter($('#crMet'),{...o,zone:o.zone*(hasPerk('scout')?1.25:1)});if(RUN!==my)return;res.push(r.score);await sleep(500)}
  const score=res.reduce((a,b)=>a+b,0)/res.length;/* 0..1 */
  const val=crOvr(c)+score*14+Math.random()*4;const pick=Math.max(1,Math.min(30,Math.round(31-(val-60)*1.4)));c.pick=pick;c.combine=Math.round(score*100);c.stage='draft';if(!P.ach.includes('rise'))P.ach.push('rise');saveP();crDraftNight()}
function crDraftNight(){const c=CAR();go('home');RUN++;const my=RUN;const pick=c.pick;
  const q=Math.max(79,Math.min(90,79+(pick-1)*.38));const trust=Math.max(22,Math.min(55,52-(pick-1)*1.0))+(hasPerk('leader')?15:0);c.trust=Math.min(70,trust);
  crBuildLeague(c,q);const team=c.league.teams[0];c.teamName=team.name;c.stage='season';
  const rvPick=Math.max(1,Math.min(30,pick+crRnd(-4,4)))===pick?(pick>1?pick-1:pick+1):Math.max(1,Math.min(30,pick+crRnd(-4,4)));
  c.rival.pick=rvPick;crNews(c,`${c.name} goes #${pick} overall to the ${team.name}`,'draft');crNews(c,`Rival watch: ${c.rival.name} taken #${rvPick} by the ${c.league.teams[c.rival.team].name}`,'rival');saveP();
  const board=[];for(let k=1;k<=Math.min(30,pick);k++)board.push(k===pick?{me:1}:k===rvPick?{n:c.rival.name,riv:1}:{n:crFake()});
  $('#app').innerHTML=`<section class="view"><div class="wrap"><div class="draft-top"><div><span class="label">Combine score ${c.combine}/100 · draft night</span><h2>The draft</h2></div></div>
    <div class="crdraft"><div class="card crboard" id="crBoard"></div><div class="card crreveal" id="crRev"><span class="label">Waiting for your name…</span><div class="spin" style="color:var(--amber)"></div></div></div></div></section>`;
  const bd=$('#crBoard');let k=0;const step=()=>{if(RUN!==my)return;if(k>=board.length){reveal();return}const b=board[k];const row=document.createElement('div');row.className='crpk'+(b.riv?' riv':'');
    row.innerHTML=b.me?`<span>#${k+1}</span><b>${esc(c.name)}</b><small>${esc(team.name)}</small>`:`<span>#${k+1}</span><b>${esc(b.n)}</b><small>${esc(crPick(TEAMS))}${b.riv?' · your rival':''}</small>`;
    if(!b.me){bd.prepend(row)}k++;setTimeout(step,b.me?0:Math.max(90,520-k*40))};step();
  const reveal=()=>{const r=$('#crRev');if(!r)return;sfx('win');confetti();vib([30,40,80]);
    r.innerHTML=`<span class="label">With the #${pick} pick, the ${esc(team.name)} select…</span><div class="crcard big">${avatarHTML({...P,signed:true,name:c.name,num:c.num},'big')}<div><h3>${esc(c.name)}</h3><span class="crarchtag">${CR_ARCH[c.arch].n} · ${c.pos}</span></div><div class="crovr"><b>${crOvr(c)}</b><small>OVR</small></div></div>
      <p class="mutep">${pick<=5?`A rebuilding team wants you to lead it. You start as their ${CR_ROLE[crRole(c)][0].toLowerCase()}.`:pick<=15?`A team on the rise. You'll earn your minutes behind ${esc(c.vet)}.`:`A contender. You're coming off the bench behind ${esc(c.vet)}. Earn the coach's trust.`}</p>
      <button class="btn btn-go btn-big" onclick="renderCareer('home')">Start your rookie season ${icon('M5 12h14M13 6l6 6-6 6',18)}</button>`}}

      <div class="card"><span class="label">Coach trust · ${CR_ROLE[role][0]} (${CR_ROLE[role][1]})</span><div class="crtrust"><i style="width:${c.trust}%"></i><em style="left:35%"></em><em style="left:55%"></em><em style="left:75%"></em></div>
        <p class="hint">${role==='bench'?`Get to 35 to become the sixth man.`:role==='sixth'?`Get to 55 to start over ${esc(c.vet)}.`:role==='starter'?`Get to 75 (and 70+ overall) to become the franchise star.`:'You run this team now.'} Good grades and wins raise trust. Bad games lower it.</p></div></div>
     <div class="stack"><div class="card"><span class="label">Season ${c.season} · ${me.w}–${me.l} · ${ordinal(seed)} of 8</span><div class="crline">${[['PTS','pts'],['REB','reb'],['AST','ast'],['STL','stl'],['BLK','blk']].map(([n,k])=>`<div><b>${crPer(c,k)}</b><small>${n}</small></div>`).join('')}</div>
        <div class="hint">FG ${c.ss.fga?Math.round(c.ss.fgm/c.ss.fga*100):0}% · 3P ${c.ss.tpa?Math.round(c.ss.tpm/c.ss.tpa*100):0}% · ${c.ss.gp} games</div></div>
      ${c.sp?`<div class="card crsp"><b>${c.sp} skill points</b> to spend <button class="btn btn-go" onclick="renderCareer('player')">Upgrade</button></div>`:''}

function crFilm(host){return new Promise(res=>{const my=RUN;const qs=shuffle(CR_FILM).slice(0,4);let i=0,ok=0;
  const step=()=>{if(RUN!==my)return;if(i>=qs.length){res(ok/qs.length);return}const q=qs[i];const opts=shuffle([q[1],...q[2]]);
    host.innerHTML=`<div class="crfilm"><span class="label">Clip ${i+1} of ${qs.length}</span><h3>${esc(q[0])}</h3><div class="lropts">${opts.map(o=>`<button class="btn btn-ghost lropt" data-fm="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`;
    $$('[data-fm]').forEach(b=>b.onclick=()=>{const r=b.dataset.fm===q[1];if(r)ok++;$$('[data-fm]').forEach(x=>{x.disabled=true;if(x.dataset.fm===q[1])x.classList.add('right');else if(x===b)x.classList.add('wrong')});sfx(r?'swish':'lose');i++;setTimeout(step,900)})};step()})}
function crLift(host){return new Promise(res=>{const my=RUN;let n=0,started=false;host.innerHTML=`<div class="crlift"><b id="crLn">0</b><small>reps</small><button class="btn btn-go btn-big" id="crL">Lift!</button><p class="hint" id="crLt">The clock starts on your first tap.</p></div>`;
  $('#crL').onclick=()=>{if(RUN!==my)return;if(!started){started=true;let t=5;$('#crLt').textContent='5s';const iv=setInterval(()=>{t--;const e=$('#crLt');if(e)e.textContent=t+'s';if(t<=0){clearInterval(iv);$('#crL').disabled=true;res(Math.min(1,n/45))}},1000)}n++;$('#crLn').textContent=n;const b=$('#crL');b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump')}})}

/* ---------- All-Star weekend (halfway through the season) ---------- */
async function crAllStar(){const c=CAR();go('home');RUN++;const my=RUN;const ppg=c.ss.gp?c.ss.pts/c.ss.gp:0;const sc=ppg+(c.ss.reb/c.ss.gp||0)*1.1+(c.ss.ast/c.ss.gp||0)*1.4;
  const picked=sc>=30||(crOvr(c)>=86&&crRole(c)==='star');const three=c.at.sht>=72;c.asDone=true;c.stage='season';saveP();
  $('#app').innerHTML=`<section class="view"><div class="wrap"><div class="draft-top"><div><span class="label">Season ${c.season} · midseason</span><h2>All-Star weekend</h2></div></div><div class="card crdrill" id="asBox"></div></div></section>`;const box=$('#asBox');
  if(!picked&&!three){box.innerHTML=`<p class="mutep">You weren't picked this year (${ppg.toFixed(1)} PPG). Keep climbing: All-Stars usually put up big numbers or carry an 82+ overall.</p><button class="btn btn-go" onclick="renderCareer('home')">Back to the season</button>`;crNews(c,`${c.name} left off the All-Star roster`,'news');saveP();return}
  let html='';if(picked){c.awards.push({n:'All-Star',s:c.season});crNews(c,`${c.name} named an All-Star!`,'big');confetti();sfx('win');html+=`<div class="result-hero" style="padding:0"><h1 style="font-size:54px">All-Star!</h1><p>You made the team in season ${c.season}.</p></div>`}
  if(three){html+=`<p class="mutep">You're also in the <b>3-point contest</b>. Ten shots; the last two are money balls worth 2.</p><button class="btn btn-go" id="as3">Step up to the rack</button>`}else html+=`<button class="btn btn-go" id="asGame">Play in the All-Star game</button>`;
  box.innerHTML=html;saveP();
  const game=()=>{const pts=Math.round(8+(crOvr(c)-70)*.6+Math.random()*14);const mvp=picked&&pts>=26&&Math.random()<.55;if(mvp){c.awards.push({n:'All-Star MVP',s:c.season});crNews(c,`${c.name} wins All-Star game MVP with ${pts}`,'big');confetti()}
    box.innerHTML=`<div class="result-hero" style="padding:0"><h1 style="font-size:48px">${pts} points</h1><p>${mvp?'All-Star game MVP!':'A fun night with the best in the league.'}</p></div><button class="btn btn-go" onclick="renderCareer('home')">Back to the season</button>`;saveP()};
  const g=$('#asGame');if(g)g.onclick=picked?game:()=>renderCareer('home');
  const t=$('#as3');if(t)t.onclick=async()=>{box.innerHTML='<div id="asM"></div>';const r=await crMeter($('#asM'),{reps:10,zone:.12+(c.at.sht-60)/300+crBonus(c,'three')*.5,speed:1.25,title:'3-point contest',label:'Shoot'});if(RUN!==my)return;
    const mine=Math.round(r.hits+(r.perf>0?1:0));const best=crRnd(6,10);const won=mine>best;if(won){c.awards.push({n:'3-Point Champion',s:c.season});crNews(c,`${c.name} wins the 3-point contest!`,'big');confetti();sfx('win')}
    box.innerHTML=`<div class="result-hero" style="padding:0"><h1 class="${won?'':'sad'}" style="font-size:48px">${mine} points</h1><p>${won?'3-Point Champion!':`The winner scored ${best}. So close.`}</p></div>${picked?'<button class="btn btn-go" id="asGame2">Play in the All-Star game</button>':'<button class="btn btn-go" onclick="renderCareer(\'home\')">Back to the season</button>'}`;saveP();
    const g2=$('#asGame2');if(g2)g2.onclick=game}}

/* ---------- playoffs, awards, offseason ---------- */
function crSeasonEnd(){const c=CAR();const st=crStandings(c);const seed=st.findIndex(t=>t.me)+1;
  if(seed<=4){const opp=st[4-seed].i;c.po={round:0,opp,w:0,l:0,need:2,seed,games:[]};c.stage='playoffs';crNews(c,`The ${c.teamName} are in the playoffs as the #${seed} seed!`,'big');saveP();return renderCareer('home')}
  c.fin='Missed the playoffs';crNews(c,`The ${c.teamName} miss the playoffs at ${c.ss.w}–${c.ss.l}`,'bad');c.stage='offseason';c.osDone=false;saveP();crOffseason()}
function crPlayoffStep(){const c=CAR();const po=c.po;const st=crStandings(c);
  if(po.w>=po.need){if(po.round===0){const others=[0,1,2,3].map(k=>st[k].i).filter(i=>i!==c.league.my&&i!==po.opp);const a=c.league.teams[others[0]],b=c.league.teams[others[1]];
      const fin=crTeamRating(c,a)+Math.random()*3>crTeamRating(c,b)+Math.random()*3?others[0]:others[1];c.po={round:1,opp:fin,w:0,l:0,need:3,seed:po.seed,games:po.games};crNews(c,`On to the Finals! Next: the ${c.league.teams[fin].name}`,'big');saveP();return renderCareer('home')}
    c.rings++;c.fin='Champion';c.po.done=true;c.champ=true;crNews(c,`CHAMPIONS! ${c.name} and the ${c.teamName} win it all!`,'big');saveP();confetti();sfx('win');c.stage='offseason';c.osDone=false;saveP();return crOffseason()}
  if(po.l>=po.need){c.fin=po.round===0?'Lost in the semifinals':'Lost in the Finals';c.po.done=true;crNews(c,`The ${c.teamName}'s season ends: ${c.fin.toLowerCase()}`,'bad');c.stage='offseason';c.osDone=false;saveP();return crOffseason()}
  c.trained=false;saveP();renderCareer('home')}
function crAwards(c){const S=c.ss,gp=Math.max(1,S.gp);const ppg=S.pts/gp,rpg=S.reb/gp,apg=S.ast/gp,spg=S.stl/gp,bpg=S.blk/gp;const sc=ppg+rpg*1.2+apg*1.5+(spg+bpg)*2+S.w/4;const out=[];
  const rv=c.rival;const rvs=rv&&rv.gp?rv.pts/rv.gp*1.25+4:0;const comp=(m,sd)=>m+gauss()*sd;
  if(c.season===1){if(sc>Math.max(rvs,comp(17,3)))out.push('Rookie of the Year');else if(rv)crNews(c,`${rv.name} beats you out for Rookie of the Year`,'rival')}
  if(c.season>1&&crOvr(c)-(c.ovrStart||crOvr(c))>=7&&Math.random()<.7)out.push('Most Improved Player');
  if(S.sixth>=gp*.6&&ppg>=12&&sc>comp(24,3))out.push('Sixth Man of the Year');
  if(spg+bpg>=2.4&&c.at.def>=82&&(spg+bpg)*10+c.at.def>comp(118,7))out.push('Defensive Player of the Year');
  const st=crStandings(c);const rank=st.findIndex(t=>t.me);
  if(rank<=1&&sc>comp(51,5))out.push('MVP');
  if(sc>comp(47,4))out.push('All-League 1st Team');else if(sc>comp(39,4))out.push('All-League 2nd Team');
  if(c.champ){const pg=c.po&&c.po.games||[];const pp=pg.length?pg.reduce((s,g)=>s+g.pts+g.reb*.8+g.ast,0)/pg.length:0;if(pp>comp(30,4))out.push('Finals MVP')}
  return{out,ppg,rpg,apg}}
function crOffseason(){const c=CAR();go('home');RUN++;const L=c.league;
  if(!c.osDone){const a=crAwards(c);a.out.forEach(n=>{c.awards.push({n,s:c.season});crNews(c,`${c.name} wins ${n}`,'big')});
    c.seasons.push({season:c.season,team:c.teamName,gp:c.ss.gp,ppg:(c.ss.pts/Math.max(1,c.ss.gp)).toFixed(1),rpg:(c.ss.reb/Math.max(1,c.ss.gp)).toFixed(1),apg:(c.ss.ast/Math.max(1,c.ss.gp)).toFixed(1),ovr:crOvr(c),fin:c.fin||'',aw:a.out});
    const before=crOvr(c);const age=c.age;const vet=hasPerk('vet')?1:0;const prim=Object.entries(CR_ARCH[c.arch].a).sort((x,y)=>y[1]-x[1])[0][0];
    CR_ATTR.forEach(([k])=>{let d=0;if(age<=22)d=crRnd(0,2)+(k===prim?crRnd(1,2):0);else if(age<=27)d=crRnd(0,1)+(k===prim&&Math.random()<.5?1:0);else if(age<=29+vet)d=Math.random()<.3?1:0;else if(age<=32+vet)d=k==='ath'?-crRnd(2,4):-crRnd(1,2);else d=k==='ath'?-crRnd(3,5):-crRnd(2,3);c.at[k]=Math.max(35,Math.min(99,c.at[k]+d))});
    c.devNote=crOvr(c)-before;c.age++;c.ovrStart=crOvr(c);
    const me=L.teams[L.my];const offers=[{name:c.teamName,stay:1,q:Math.max(79,Math.min(91,me.q+(c.champ?0:crRnd(-1,2)))),trust:Math.min(95,c.trust+(c.champ?5:0))}];
    shuffle(TEAMS.filter(t=>t!==c.teamName)).slice(0,2).forEach((t,i)=>{const q=i===0?80+Math.random()*4:86+Math.random()*4;offers.push({name:t,q,trust:Math.max(25,Math.min(90,(i===0?70:45)+(crOvr(c)-70)*.8))})});
    c.offers=offers;c.osDone=true;c.champ=false;saveP();dbEvent('career',{k:'season',s:c.season,fin:c.fin||''})}
  const last=c.seasons[c.seasons.length-1];const forced=c.age>=40||(c.age>=35&&crOvr(c)<62);
  $('#app').innerHTML=`<section class="view"><div class="wrap"><div class="draft-top"><button class="btn btn-ghost" onclick="go('home')">${icon('M19 12H5M11 18l-6-6 6-6')} Home</button><div><span class="label">Season ${c.season} is over · ${esc(last.fin||'')}</span><h2>The offseason</h2></div></div>
    <div class="lg-grid"><div class="card"><span class="label">Season ${c.season} awards</span>${last.aw.length?`<div class="crtro">${last.aw.map((n,i)=>`<div class="crt" style="animation-delay:${i*250}ms"><b>${esc(n)}</b><small>Season ${c.season}</small></div>`).join('')}</div>`:'<p class="mutep">No awards this time. Next year.</p>'}
      <div class="crline" style="margin-top:12px"><div><b>${last.ppg}</b><small>PPG</small></div><div><b>${last.rpg}</b><small>RPG</small></div><div><b>${last.apg}</b><small>APG</small></div><div><b>${crOvr(c)}</b><small>OVR now</small></div></div>
      <p class="hint">You're turning ${c.age}. Offseason development: ${c.devNote>0?'+':''}${c.devNote} overall.${c.age>=31?' Your athleticism is starting to slip.':''}</p></div>
     <div class="card"><span class="label">${forced?'Your body says it\'s time':'Contract offers'}</span>
      ${forced?`<p class="mutep">After ${c.seasons.length} seasons, it's time to hang them up.</p><button class="btn btn-go btn-big" onclick="crRetire()">Retire and see your legacy</button>`:
       c.offers.map((o,i)=>`<button class="crof" data-cro="${i}"><b>${o.stay?'Re-sign with the ':''}${esc(o.name)}</b><small>Team strength ${o.q.toFixed(1)} · you'd start as: ${CR_ROLE[o.trust>=75?'star':o.trust>=55?'starter':o.trust>=35?'sixth':'bench'][0]}</small></button>`).join('')+
       (c.age>=32?'<button class="btn btn-ghost warn" style="margin-top:10px" onclick="crRetire()">Retire instead</button>':'')}</div></div></div></section>`;
  if(last.aw.length){confetti();sfx('win')}
  $$('[data-cro]').forEach(b=>b.onclick=()=>{const o=c.offers[+b.dataset.cro];const L=c.league;let keep=null;
    if(o.stay){keep={...L.teams[L.my]};}else{c.teamName=o.name}
    c.trust=o.trust;c.season++;c.stage='season';c.fin='';crBuildLeague(c,o.q,keep?{...keep,name:c.teamName}:null);if(!o.stay){c.league.teams[0].name=o.name;const used=new Set([o.name]);c.league.teams.slice(1).forEach(t=>{if(used.has(t.name))t.name=TEAMS.find(n=>!used.has(n)&&!c.league.teams.some(x=>x.name===n))||t.name+' II';used.add(t.name)})}
    crNews(c,o.stay?`${c.name} re-signs with the ${c.teamName}`:`${c.name} signs with the ${o.name}!`,'big');c.offers=null;saveP();sfx('chime');renderCareer('home')})}
function crLegacyScore(c){const n=x=>c.awards.filter(a=>a.n===x).length;const pts=c.bd.pts||0;
  return Math.round(c.rings*40+n('MVP')*50+n('Finals MVP')*30+n('All-Star')*10+n('All-League 1st Team')*15+n('All-League 2nd Team')*8+n('Defensive Player of the Year')*20+n('Rookie of the Year')*12+n('Sixth Man of the Year')*8+n('Most Improved Player')*6+n('3-Point Champion')*5+pts/150+c.seasons.length*3)}
function crRetire(){const c=CAR();if(!c)return;go('home');RUN++;const score=crLegacyScore(c);const vote=Math.max(2,Math.min(99,Math.round(score/2.2+Math.random()*6)));const hof=vote>=75;
  const lp=Math.max(5,Math.round(score/8));const L=LEG();L.pts+=lp;L.careers.unshift({name:c.name,pos:c.pos,seasons:c.seasons.length,rings:c.rings,score,hof,pts:c.bd.pts||0,d:Date.now()});L.careers=L.careers.slice(0,20);
  c.stage='retired';P.car=null;saveP();dbScore('legacy',Math.min(5000,score));dbEvent('career',{k:'retire',score,hof});if(hof&&!P.ach.includes('hof'))P.ach.push('hof');saveP();
  const tot=c.bd;$('#app').innerHTML=`<section class="view"><div class="wrap"><div class="crret"><span class="label">${esc(c.name)} · ${c.seasons.length} season${c.seasons.length===1?'':'s'} · ${c.rings} ring${c.rings===1?'':'s'}</span><h2 class="mtitle">The Hall of Fame vote</h2>
    <div class="crvote"><b id="crV">0%</b><i><s id="crVb"></s><em></em></i><small>75% needed</small></div><div id="crVr" class="crvr"></div>
    <div class="crline" style="margin:16px 0"><div><b>${tot.pts||0}</b><small>Career PTS</small></div><div><b>${tot.reb||0}</b><small>REB</small></div><div><b>${tot.ast||0}</b><small>AST</small></div><div><b>${score}</b><small>Legacy score</small></div></div>
    <p class="mutep">+${lp} legacy points. You now have ${L.pts}. Spend them on perks for your next player.</p>
    <div class="crperks">${CR_PERKS.map(p=>{const own=L.perks.includes(p[0]);return `<button class="crperk ${own?'own':''}" data-crk="${p[0]}" ${own||L.pts<p[3]?'disabled':''}><b>${p[1]}</b><small>${p[2]}</small><em>${own?'Owned':p[3]+' LP'}</em></button>`}).join('')}</div>
    <div class="actions"><button class="btn btn-go btn-big" onclick="crCreateScreen()">Start a new career</button><button class="btn btn-ghost" onclick="openBoards('legacy')">Legacy leaderboard</button></div></div></div></section>`;
  let v=0;const iv=setInterval(()=>{v=Math.min(vote,v+2);const e=$('#crV'),b=$('#crVb');if(!e){clearInterval(iv);return}e.textContent=v+'%';b.style.width=v+'%';if(v>=vote){clearInterval(iv);const r=$('#crVr');r.innerHTML=hof?`<b class="hofin">INDUCTED INTO THE HALL OF FAME</b>`:`<b>Not this time.</b> ${vote}% of the vote.`;if(hof){confetti();sfx('win');vib([40,40,120])}else sfx('lose')}},40);
  $$('[data-crk]').forEach(b=>b.onclick=()=>{const p=CR_PERKS.find(x=>x[0]===b.dataset.crk);if(L.pts<p[3])return;L.pts-=p[3];L.perks.push(p[0]);saveP();sfx('chime');b.classList.add('own');b.disabled=true;b.querySelector('em').textContent='Owned';$$('[data-crk]').forEach(x=>{const q=CR_PERKS.find(y=>y[0]===x.dataset.crk);if(!L.perks.includes(q[0])&&L.pts<q[3])x.disabled=true})})}

document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-rx]');if(b&&ON.st&&!ON.st.solo){act({t:'react',e:b.dataset.rx});b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit')}});
$('#logoBtn').onclick=()=>go('home');
$('#onlineNav').onclick=()=>openOnline('host');
$('#acctBtn').onclick=()=>openDrawer();
$('#scrim').onclick=closeAll;
addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
$$('[data-open]').forEach(b=>b.onclick=()=>b.dataset.open==='howto'?openHowTo():openHof());
{const sb=$('#sndBtn');sb.innerHTML=icon(soundIcon())+`<span>${SND.on?'Sound on':'Muted'}</span>`;sb.onclick=soundToggle;$('#instBtn').onclick=pwaInstall;pwaInit()}

smoothInstall();liveTheme();liveStripPaint();liveMaint();refreshNav();renderHome();setTimeout(livePopups,2200);setTimeout(()=>{tixDaily();lockerAuto()},3200);

{const m=location.hash.match(/^#join-([A-Za-z0-9]{5})$/);if(m)openOnline('join',m[1].toUpperCase())}
addEventListener('hashchange',()=>{liveMaint();adminRoute()});adminRoute();setTimeout(liveInit,1200);setTimeout(dbInit,600);
